<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de plan</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#15374a}.bar{height:54px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid #dbe5e8}.bar strong{margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{border:0;border-radius:11px;padding:9px 12px;background:#e7edef;color:#15374a;font-weight:850;cursor:pointer}iframe{display:block;width:100%;height:calc(100% - 54px);border:0}.error{display:grid;place-items:center;height:100%;padding:20px;text-align:center}</style></head><body><header class="bar"><button class="btn" onclick="location.href='planes-arbol.html?v=1'">← Volver al árbol</button><strong id="context">Cargando plan…</strong></header><iframe id="editor" src="planes-evaluacion.html?v=2" title="Evaluación del plan"></iframe><script>
const params=new URLSearchParams(location.search);const school=params.get('school')||localStorage.getItem('pciActiveSchool')||'1';const area=params.get('area')||'';const group=params.get('group')||'0';const plan=params.get('plan')||'0';const frame=document.getElementById('editor'),context=document.getElementById('context');
localStorage.setItem('pciActiveSchool',school);
function matrix(){try{return JSON.parse(localStorage.getItem(`pciAppV2_school_${school}`)||localStorage.getItem('pciAppV2')||'{"areas":{}}')}catch{return{areas:{}}}}
const m=matrix(),groupName=m.areas?.[area]?.groups?.[+group]?.name||`Agrupamiento ${+group+1}`;context.textContent=`${area} · ${groupName} · Plan ${+plan+1}`;
frame.addEventListener('load',()=>{try{const w=frame.contentWindow;w.eval(`selection.school=${JSON.stringify(school)};selection.area=${JSON.stringify(area)};selection.group=${JSON.stringify(group)};selection.plan=${JSON.stringify(plan)};loadSchool();go(2);`)}catch(e){console.error(e);document.body.innerHTML='<div class="error"><div><h2>No se pudo abrir el plan</h2><p>Volvé al árbol e intentá nuevamente.</p></div></div>'}});
</script></body></html>
