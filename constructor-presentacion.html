<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constructor · Presentación</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7f8;color:#15374a}header{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #dbe5e8}header strong{margin-right:auto}.tag,.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900}.tag{background:#fff3d8;color:#805600}.btn{background:#e7edef;color:#15374a;cursor:pointer}.mint{background:#83ded3}main{max-width:1050px;margin:auto;padding:18px 14px}.card{background:#fff;border:1px solid #dbe5e8;border-radius:18px;padding:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid #dbe5e8;border-radius:999px;padding:9px 12px;background:#fff;font-weight:900}.tab.on{background:#15374a;color:#fff}.panel{display:none}.panel.on{display:block}.grid,.weights{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.weights{grid-template-columns:repeat(4,1fr)}label{display:block;font-weight:800;font-size:.82rem;margin:6px 0}input,textarea{width:100%;padding:10px;border:1px solid #dbe5e8;border-radius:10px}textarea{min-height:88px}.stage{border:1px solid #dbe5e8;border-radius:14px;padding:12px;margin:10px 0}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.levels textarea{font-size:.78rem}.status{padding:10px;border-radius:10px;background:#e5f6ef;color:#167557;font-weight:900;margin:10px 0}@media(max-width:760px){.grid,.weights,.levels{grid-template-columns:1fr}}</style></head><body><header><span class="tag">PRESENTACIÓN</span><strong id="ctx">Constructor</strong><button class="btn" onclick="location.href='planes-presentacion.html'">← Planes</button><button id="save" class="btn mint">Guardar demo</button></header><main><section class="card"><h1 id="title"></h1><div class="tabs"><button class="tab on" data-p="info">Información</button><button class="tab" data-p="content">Contenidos</button><button class="tab" data-p="rubric">Rúbrica</button></div><div id="info" class="panel on"></div><div id="content" class="panel"></div><div id="rubric" class="panel"></div></section></main><script>(function(){var S=['Punto de partida','Indagación','Producción','Evaluación'],L=['En proceso','Iniciado','Suficiente','Avanzado'],q=new URLSearchParams(location.search),area=q.get('area')||'Lengua y Literatura',group=Number(q.get('group')||0),plan=Number(q.get('plan')||0),key=area+'|'+group+'|'+plan;function $(x){return document.getElementById(x)}function read(){try{return JSON.parse(localStorage.getItem('pciDemoPlanDesignV1_school_1'))||{plans:{}}}catch(e){return{plans:{}}}}var db=read();function fresh(){var c={};S.forEach(function(s){c[s]=[{name:'Criterio 1',levels:['','','','']}]});return{name:'Plan '+(plan+1),synopsis:'',duration:'',time:'',customContents:[],customObjectives:[],weights:{'Punto de partida':25,'Indagación':25,'Producción':25,'Evaluación':25},criteria:c}}if(!db.plans[key])db.plans[key]=fresh();var p=db.plans[key];function save(){localStorage.setItem('pciDemoPlanDesignV1_school_1',JSON.stringify(db));$('save').textContent='Guardado';setTimeout(function(){$('save').textContent='Guardar demo'},700)}function render(){$('ctx').textContent=area+' · Plan '+(plan+1);$('title').textContent=p.name;$('info').innerHTML='<div class="grid"><div><label>Nombre</label><input id="name" value="'+p.name+'"></div><div><label>Duración</label><input id="duration" value="'+(p.duration||'')+'"></div><div><label>Ubicación temporal</label><input id="time" value="'+(p.time||'')+'"></div><div><label>Sinopsis</label><textarea id="synopsis">'+(p.synopsis||'')+'</textarea></div></div>';$('content').innerHTML='<h2>Contenidos y objetivos</h2><label>Contenidos específicos</label><textarea id="customContents">'+(p.customContents||[]).join('\n')+'</textarea><label>Objetivos específicos</label><textarea id="customObjectives">'+(p.customObjectives||[]).join('\n')+'</textarea>';$('rubric').innerHTML='<h2>Rúbrica del plan</h2><div class="weights">'+S.map(function(s){return'<div><label>'+s+'</label><input data-w="'+s+'" type="number" value="'+p.weights[s]+'"></div>'}).join('')+'</div><div class="status">Total: '+S.reduce(function(a,s){return a+Number(p.weights[s]||0)},0)+' / 100</div>'+S.map(function(s){return'<section class="stage"><h3>'+s+'</h3>'+p.criteria[s].map(function(c,i){return'<input data-cn="'+s+'|'+i+'" value="'+c.name+'"><div class="levels">'+L.map(function(l,j){return'<div><label>'+l+'</label><textarea data-lv="'+s+'|'+i+'|'+j+'">'+(c.levels[j]||'')+'</textarea></div>'}).join('')+'</div>'}).join('')+'</section>'}).join('');bind()}function bind(){['name','duration','time','synopsis'].forEach(function(id){$(id).oninput=function(){p[id]=this.value;if(id==='name')$('title').textContent=this.value;save()}});$('customContents').oninput=function(){p.customContents=this.value.split('\n').filter(Boolean);save()};$('customObjectives').oninput=function(){p.customObjectives=this.value.split('\n').filter(Boolean);save()};document.querySelectorAll('[data-w]').forEach(function(e){e.onchange=function(){p.weights[this.dataset.w]=Number(this.value)||0;save();render()}});document.querySelectorAll('[data-cn]').forEach(function(e){e.oninput=function(){var a=this.dataset.cn.split('|');p.criteria[a[0]][Number(a[1])].name=this.value;save()}});document.querySelectorAll('[data-lv]').forEach(function(e){e.oninput=function(){var a=this.dataset.lv.split('|');p.criteria[a[0]][Number(a[1])].levels[Number(a[2])]=this.value;save()}})}document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b)});document.querySelectorAll('.panel').forEach(function(x){x.classList.toggle('on',x.id===b.dataset.p)})}});$('save').onclick=save;render()})();</script></body></html>
