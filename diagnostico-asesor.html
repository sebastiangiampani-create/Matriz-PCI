<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Asesor Curricular</title><style>:root{--ink:#15374a;--bg:#eef3f4;--line:#d7e2e5;--ok:#167557;--bad:#b52f48;--warn:#9a6500}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f2}.row:last-child{border-bottom:0}.status{font-weight:900}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}button{border:0;border-radius:12px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:900;cursor:pointer}.log{margin-top:14px;padding:12px;border-radius:12px;background:#f6f8f9;white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace}</style></head><body><main><h1>Diagnóstico técnico</h1><p>Verifica compatibilidad del navegador, archivos de datos, reglas, motor curricular y estado local.</p><button id="run">Ejecutar diagnóstico</button><section class="card" id="results" style="margin-top:14px"></section><div id="log" class="log"></div></main><script src="motor-curricular.js"></script><script>const files=['data/db1.txt','data/db2.txt','data/db3.txt','data/db4.txt','data/rest1.txt','data/rest2.txt','data/rest3.txt','data/rest4.txt','data/rest5.txt'];const results=document.getElementById('results'),log=document.getElementById('log');const tests=[];function add(name,status,detail=''){tests.push({name,status,detail})}function render(){results.innerHTML=tests.map(t=>`<div class="row"><div><b>${t.name}</b>${t.detail?`<div style="font-size:.8rem;color:#687985">${t.detail}</div>`:''}</div><span class="status ${t.status}">${t.status==='ok'?'OK':t.status==='warn'?'REVISAR':'ERROR'}</span></div>`).join('')}async function run(){tests.length=0;log.textContent='';try{add('JavaScript moderno',typeof Promise==='function'?'ok':'bad');add('DecompressionStream',typeof DecompressionStream==='function'?'ok':'bad',typeof DecompressionStream==='function'?'Disponible':'Este navegador no puede descomprimir la base actual');add('LocalStorage',(()=>{try{localStorage.setItem('__pci_test__','1');localStorage.removeItem('__pci_test__');return'ok'}catch{return'bad'}})());const responses=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(`${f}: HTTP ${r.status}`);return r.text()}));add('Archivos de datos','ok',`${responses.length} archivos accesibles`);let data=[];if(typeof DecompressionStream==='function'){const b64=responses.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();data=JSON.parse(text);add('Base descomprimida','ok',`${data.length} contenidos cargados`)}const rr=await fetch('data/reglas-curriculares.json',{cache:'no-store'});if(!rr.ok)throw Error(`reglas: HTTP ${rr.status}`);const rules=await rr.json();add('Reglas curriculares','ok',`Versión ${rules.version||'sin versión'}`);add('Motor curricular',window.MotorCurricular&&typeof MotorCurricular.evaluate==='function'?'ok':'bad',window.MotorCurricular?.version||'No disponible');let app={areas:{},otherFormats:[]};try{app=JSON.parse(localStorage.getItem('pciAppV2')||'{"areas":{},"otherFormats":[]}');add('Propuesta local','ok',`${Object.keys(app.areas||{}).length} áreas cargadas`)}catch{add('Propuesta local','bad','El JSON guardado está dañado')}if(data.length&&window.MotorCurricular){const mapped=data.map(([id,area,subject,axis,text])=>({id,area,subject,axis,text}));const report=MotorCurricular.evaluate({app,data:mapped,rules});add('Evaluación completa','ok',`${report.recommendations.length} observaciones generadas`)}log.textContent='Diagnóstico finalizado.'}catch(e){console.error(e);add('Ejecución general','bad',e.message);log.textContent=e.stack||e.message}render()}document.getElementById('run').onclick=run;run();</script></body></html>
