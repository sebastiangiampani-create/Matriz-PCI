<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz PCI</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f8;color:#15374a}body{display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 12px;background:#fff;border-bottom:1px solid #dbe5e8}.brand{font-weight:900;margin-right:auto}.school-name{font-weight:800;color:#687985}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:#e7edef;color:#15374a;cursor:pointer}.btn.primary{background:#15374a;color:#fff}.btn.mint{background:#83ded3}.frame-wrap{position:relative;flex:1;min-height:0}.frame{width:100%;height:100%;border:0;display:block}.footer{min-height:31px;display:flex;align-items:center;justify-content:center;background:#fff;border-top:1px solid #dbe5e8;color:#687985;font-size:.76rem;font-weight:700}.picker{position:fixed;inset:0;z-index:100;background:#f4f7f8;display:grid;place-items:center;padding:20px}.picker.hidden{display:none}.picker-card{width:min(600px,100%);background:#fff;border:1px solid #dbe5e8;border-radius:24px;padding:28px;box-shadow:0 20px 60px #15374a20}.picker h1{margin-top:0}.school-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.school{min-height:110px;border:1px solid #dbe5e8;border-radius:18px;background:#fff;color:#15374a;font-size:1.05rem;font-weight:900;cursor:pointer}.school:hover{border-color:#83ded3;background:#f0fbf9}@media(max-width:900px){.top{flex-wrap:wrap}.brand{width:100%;margin:0}.school-name{margin-right:auto}.btn{padding:9px 10px;font-size:.82rem}}@media(max-width:700px){.school-grid{grid-template-columns:1fr}.school{min-height:72px}.picker-card{padding:20px}.footer{font-size:.7rem}}</style></head><body><header class="top"><div class="brand">Escuela de Maestros · Matriz PCI</div><div id="schoolName" class="school-name"></div><button id="back" class="btn" hidden>← Volver</button><button id="changeSchool" class="btn" hidden>Cambiar escuela</button><button id="control" class="btn mint" hidden>Tabla de control</button><button id="pdf" class="btn primary" hidden>Imprimir avance</button></header><main class="frame-wrap"><iframe id="app" class="frame" title="Matriz PCI"></iframe></main><footer class="footer">Diseñado por Sebastián Giampani</footer><section id="picker" class="picker"><div class="picker-card"><h1>Seleccionar escuela</h1><p>La información de cada escuela se guarda por separado en este dispositivo.</p><div class="school-grid"><button class="school" data-school="1">Escuela 1</button><button class="school" data-school="2">Escuela 2</button><button class="school" data-school="3">Escuela 3</button></div></div></section><script>
const frame=document.getElementById('app'),picker=document.getElementById('picker'),schoolName=document.getElementById('schoolName'),back=document.getElementById('back'),changeSchool=document.getElementById('changeSchool'),control=document.getElementById('control'),pdf=document.getElementById('pdf');let currentSchool=null,syncTimer=null;
const key=n=>'pciAppV2_school_'+n;const empty='{"areas":{},"current":null}';
function saveCurrent(){if(!currentSchool)return;localStorage.setItem(key(currentSchool),localStorage.getItem('pciAppV2')||empty)}
function chooseSchool(n){saveCurrent();currentSchool=n;localStorage.setItem('pciActiveSchool',n);localStorage.setItem('pciAppV2',localStorage.getItem(key(n))||empty);schoolName.textContent='Escuela '+n;picker.classList.add('hidden');changeSchool.hidden=false;control.hidden=false;pdf.hidden=false;frame.src='app.html?v=process-report-9';clearInterval(syncTimer);syncTimer=setInterval(saveCurrent,800)}
function state(){const W=frame.contentWindow;if(!W)return null;try{return{W,DATA:W.eval('DATA'),CFG:W.eval('CFG'),app:W.eval('app')}}catch{return null}}
function activeScreen(){return frame.contentDocument?.querySelector('.screen.active')?.id||''}
function syncButtons(){if(!currentSchool){back.hidden=true;return}const s=activeScreen();back.hidden=s==='start'||!s}
function goBack(){const S=state(),s=activeScreen();if(!S)return;if(s==='summary')S.W.show('board');else if(s==='board')S.W.show('areas');else if(s==='areas'){saveCurrent();picker.classList.remove('hidden')}else S.W.show('areas')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reportData(){const S=state();if(!S||!Array.isArray(S.DATA)||!S.DATA.length){alert('La base todavía está cargando. Esperá unos segundos y volvé a intentar.');return null}saveCurrent();const{DATA,CFG,app}=S,rows=[];for(const area of Object.keys(CFG)){const data=app.areas[area],all=DATA.filter(x=>x.area===area);for(const x of all){const groups=data?data.groups.filter(g=>g.items.includes(x.id)).map(g=>g.name):[];rows.push({area,subject:x.subject,axis:x.axis,text:x.text,groups:groups.length?groups.join(' · '):'Pendiente'})}}return{DATA,CFG,app,rows}}
function tableHTML(rows){return `<h2>Tabla de control</h2><table><thead><tr><th>Área</th><th>Materia</th><th>Eje/Bloque</th><th>Contenido priorizado</th><th>Agrupamiento donde quedó</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.area)}</td><td>${esc(r.subject)}</td><td>${esc(r.axis||'')}</td><td>${esc(r.text)}</td><td class="${r.groups==='Pendiente'?'pending':''}">${esc(r.groups)}</td></tr>`).join('')}</tbody></table>`}
function baseStyles(){return `body{font-family:Arial,sans-serif;color:#15374a;margin:22px}h1{margin-bottom:4px}h2{border-bottom:2px solid #83ded3;padding-bottom:5px}.summary{display:flex;gap:20px;flex-wrap:wrap;background:#edf5f6;padding:12px;border-radius:10px;margin:12px 0 18px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #b9c7cc;padding:5px;text-align:left;vertical-align:top}th{background:#edf5f6}.pending{color:#9a6500;font-weight:bold}.tools{position:sticky;top:0;background:white;padding:10px 0;display:flex;justify-content:flex-end;gap:8px}.tools button{border:0;border-radius:10px;padding:10px 14px;background:#15374a;color:white;font-weight:bold;cursor:pointer}.tools .download{background:#83ded3;color:#15374a}.credit{text-align:center;color:#687985;margin-top:28px}@media print{.tools{display:none}body{margin:8mm}}`}
function downloadControlXLS(){const R=reportData();if(!R)return;const rows=R.rows.map(r=>`<tr><td>${esc(r.area)}</td><td>${esc(r.subject)}</td><td>${esc(r.axis||'')}</td><td>${esc(r.text)}</td><td>${esc(r.groups)}</td></tr>`).join('');const html=`<!doctype html><html><head><meta charset="utf-8"><style>table{border-collapse:collapse}th,td{border:1px solid #999;padding:5px;vertical-align:top}th{background:#dceff0}</style></head><body><h1>Tabla de control · Escuela ${currentSchool}</h1><table><thead><tr><th>Área</th><th>Materia</th><th>Eje/Bloque</th><th>Contenido priorizado</th><th>Agrupamiento donde quedó</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`Tabla_de_control_Escuela_${currentSchool}.xls`;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)}
function openControl(){const R=reportData();if(!R)return;const assigned=R.rows.filter(r=>r.groups!=='Pendiente').length,win=window.open('','_blank');if(!win){alert('El navegador bloqueó la ventana. Habilitá ventanas emergentes.');return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Tabla de control · Escuela ${currentSchool}</title><style>${baseStyles()}</style></head><body><div class="tools"><button class="download" onclick="opener.downloadControlXLS()">Descargar XLS</button><button onclick="print()">Imprimir / Guardar PDF</button></div><h1>Tabla de control · Escuela ${currentSchool}</h1><div class="summary"><b>${assigned} contenidos asignados</b><b>${R.rows.length-assigned} pendientes</b><b>${R.rows.length} contenidos totales</b></div>${tableHTML(R.rows)}<p class="credit">Diseñado por Sebastián Giampani</p></body></html>`);win.document.close();win.focus()}
function printProgress(){const R=reportData();if(!R)return;const areas=Object.keys(R.CFG).map(area=>{const data=R.app.areas[area];if(!data)return'';const groups=data.groups.filter(g=>(g.items&&g.items.length)||g.objective?.trim()||g.context?.trim()||g.type);if(!groups.length)return'';return `<section class="area"><h2>${esc(area)}</h2><div class="group-grid">${groups.map(g=>`<article class="group-card"><h3>${esc(g.name)}</h3>${g.objective?.trim()?`<p><b>Objetivos:</b> ${esc(g.objective)}</p>`:''}${g.context?.trim()?`<p><b>Contexto:</b> ${esc(g.context)}</p>`:''}${g.type?`<p><b>Tipo:</b> ${esc(g.type)}</p>`:''}<div class="contents"><b>Contenidos</b><ul>${(g.items||[]).map(id=>{const x=R.DATA.find(y=>y.id===id);return x?`<li>${esc(x.text)}</li>`:''}).join('')||'<li>Sin contenidos asignados</li>'}</ul></div></article>`).join('')}</div></section>`}).filter(Boolean).join('');if(!areas){alert('Todavía no hay avances para imprimir.');return}const win=window.open('','_blank');if(!win){alert('El navegador bloqueó la ventana. Habilitá ventanas emergentes.');return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Informe de avance · Escuela ${currentSchool}</title><style>${baseStyles()}.area{margin:26px 0;break-inside:avoid}.area h2{font-size:22px;margin-bottom:14px}.group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.group-card{border:1px solid #cdd9dd;border-radius:12px;padding:14px;break-inside:avoid;background:#fff}.group-card h3{margin:0 0 10px}.group-card p{margin:7px 0}.contents ul{margin:8px 0 0;padding-left:20px}.contents li{margin:5px 0}@media(max-width:700px){.group-grid{grid-template-columns:1fr}}@media print{.group-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.area{break-before:page}.area:first-of-type{break-before:auto}}</style></head><body><div class="tools"><button onclick="print()">Imprimir / Guardar PDF</button></div><h1>Informe de avance · Escuela ${currentSchool}</h1><p>Áreas, agrupamientos y contenidos trabajados hasta el momento.</p>${areas}<p class="credit">Diseñado por Sebastián Giampani</p></body></html>`);win.document.close();win.focus();setTimeout(()=>win.print(),600)}
document.querySelectorAll('[data-school]').forEach(b=>b.onclick=()=>chooseSchool(b.dataset.school));back.onclick=goBack;changeSchool.onclick=()=>{saveCurrent();picker.classList.remove('hidden')};control.onclick=openControl;pdf.onclick=printProgress;frame.addEventListener('load',()=>{setTimeout(syncButtons,300);setInterval(syncButtons,500)});window.addEventListener('beforeunload',saveCurrent);const active=localStorage.getItem('pciActiveSchool');if(active&&['1','2','3'].includes(active))chooseSchool(active);
</script></body></html>
