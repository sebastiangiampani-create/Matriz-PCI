<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz PCI</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f8;color:#15374a}body{display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 12px;background:#fff;border-bottom:1px solid #dbe5e8}.brand{font-weight:900;margin-right:auto}.school-name{font-weight:800;color:#687985}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:#e7edef;color:#15374a;cursor:pointer}.btn.primary{background:#15374a;color:#fff}.btn.mint{background:#83ded3}.frame-wrap{position:relative;flex:1;min-height:0}.frame{width:100%;height:100%;border:0;display:block}.footer{min-height:31px;display:flex;align-items:center;justify-content:center;background:#fff;border-top:1px solid #dbe5e8;color:#687985;font-size:.76rem;font-weight:700}.picker{position:fixed;inset:0;z-index:100;background:#f4f7f8;display:grid;place-items:center;padding:20px}.picker.hidden{display:none}.picker-card{width:min(600px,100%);background:#fff;border:1px solid #dbe5e8;border-radius:24px;padding:28px;box-shadow:0 20px 60px #15374a20}.picker h1{margin-top:0}.school-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.school{min-height:110px;border:1px solid #dbe5e8;border-radius:18px;background:#fff;color:#15374a;font-size:1.05rem;font-weight:900;cursor:pointer}.school:hover{border-color:#83ded3;background:#f0fbf9}@media(max-width:700px){.top{flex-wrap:wrap}.brand{width:100%;margin:0}.school-name{margin-right:auto}.btn{padding:9px 10px;font-size:.82rem}.school-grid{grid-template-columns:1fr}.school{min-height:72px}.picker-card{padding:20px}.footer{font-size:.7rem}}</style></head><body><header class="top"><div class="brand">Escuela de Maestros · Matriz PCI</div><div id="schoolName" class="school-name"></div><button id="back" class="btn" hidden>← Volver</button><button id="changeSchool" class="btn" hidden>Cambiar escuela</button><button id="pdf" class="btn primary" hidden>Vista PDF</button></header><main class="frame-wrap"><iframe id="app" class="frame" title="Matriz PCI"></iframe></main><footer class="footer">Diseñado por Sebastián Giampani</footer><section id="picker" class="picker"><div class="picker-card"><h1>Seleccionar escuela</h1><p>La información de cada escuela se guarda por separado en este dispositivo.</p><div class="school-grid"><button class="school" data-school="1">Escuela 1</button><button class="school" data-school="2">Escuela 2</button><button class="school" data-school="3">Escuela 3</button></div></div></section><script>
const frame=document.getElementById('app'),picker=document.getElementById('picker'),schoolName=document.getElementById('schoolName'),back=document.getElementById('back'),changeSchool=document.getElementById('changeSchool'),pdf=document.getElementById('pdf');let currentSchool=null,syncTimer=null;
const key=n=>'pciAppV2_school_'+n;const empty='{"areas":{},"current":null}';
function saveCurrent(){if(!currentSchool)return;const value=localStorage.getItem('pciAppV2')||empty;localStorage.setItem(key(currentSchool),value)}
function chooseSchool(n){saveCurrent();currentSchool=n;localStorage.setItem('pciActiveSchool',n);localStorage.setItem('pciAppV2',localStorage.getItem(key(n))||empty);schoolName.textContent='Escuela '+n;picker.classList.add('hidden');changeSchool.hidden=false;pdf.hidden=false;frame.src='app.html?v=school-pdf-3';clearInterval(syncTimer);syncTimer=setInterval(saveCurrent,800)}
function activeScreen(){return frame.contentDocument?.querySelector('.screen.active')?.id||''}
function syncButtons(){if(!currentSchool){back.hidden=true;return}const s=activeScreen();back.hidden=s==='start'||!s}
function goBack(){const W=frame.contentWindow,s=activeScreen();if(!W)return;if(s==='summary')W.show('board');else if(s==='board')W.show('areas');else if(s==='areas'){saveCurrent();picker.classList.remove('hidden')}else W.show('areas')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makePDF(){const W=frame.contentWindow;if(!W?.DATA?.length||!W.CFG||!W.app){alert('Esperá a que termine de cargar la matriz.');return}saveCurrent();const rows=[];for(const area of Object.keys(W.CFG)){const data=W.app.areas[area],all=W.DATA.filter(x=>x.area===area);for(const x of all){const groups=data?data.groups.filter(g=>g.items.includes(x.id)).map(g=>g.name):[];rows.push({area,subject:x.subject,axis:x.axis,text:x.text,groups:groups.length?groups.join(' · '):'Pendiente'})}}const details=Object.keys(W.CFG).map(area=>{const data=W.app.areas[area];if(!data)return `<section><h2>${esc(area)}</h2><p>Área todavía no iniciada.</p></section>`;return `<section><h2>${esc(area)}</h2>${data.groups.map(g=>`<article><h3>${esc(g.name)}</h3><p><b>Objetivos:</b> ${esc(g.objective||'Pendiente')}</p>${g.context?`<p><b>Contexto:</b> ${esc(g.context)}</p>`:''}${g.type?`<p><b>Tipo:</b> ${esc(g.type)}</p>`:''}<ul>${(g.items||[]).map(id=>{const x=W.DATA.find(y=>y.id===id);return x?`<li>${esc(x.text)}</li>`:''}).join('')||'<li>Sin contenidos asignados</li>'}</ul></article>`).join('')}</section>`}).join('');const win=window.open('','_blank');if(!win){alert('El navegador bloqueó la ventana. Habilitá ventanas emergentes para generar el PDF.');return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Matriz PCI · Escuela ${currentSchool}</title><style>body{font-family:Arial,sans-serif;color:#15374a;margin:22px}h1{margin-bottom:4px}h2{border-bottom:2px solid #83ded3;padding-bottom:5px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #b9c7cc;padding:5px;text-align:left;vertical-align:top}th{background:#edf5f6}section{break-before:page}article{break-inside:avoid;border:1px solid #dbe5e8;border-radius:10px;padding:10px;margin:9px 0}.credit{text-align:center;color:#687985;margin-top:28px}@media print{body{margin:8mm}section:first-of-type{break-before:auto}}</style></head><body><h1>Matriz PCI · Escuela ${currentSchool}</h1><p>Tabla de ubicación de contenidos priorizados</p><table><thead><tr><th>Área</th><th>Materia</th><th>Eje/Bloque</th><th>Contenido priorizado</th><th>Agrupamiento donde quedó</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.area)}</td><td>${esc(r.subject)}</td><td>${esc(r.axis||'')}</td><td>${esc(r.text)}</td><td>${esc(r.groups)}</td></tr>`).join('')}</tbody></table>${details}<p class="credit">Diseñado por Sebastián Giampani</p></body></html>`);win.document.close();win.focus();setTimeout(()=>win.print(),500)}
document.querySelectorAll('[data-school]').forEach(b=>b.onclick=()=>chooseSchool(b.dataset.school));back.onclick=goBack;changeSchool.onclick=()=>{saveCurrent();picker.classList.remove('hidden')};pdf.onclick=makePDF;frame.addEventListener('load',()=>{setTimeout(syncButtons,300);setInterval(syncButtons,500)});window.addEventListener('beforeunload',saveCurrent);const active=localStorage.getItem('pciActiveSchool');if(active&&['1','2','3'].includes(active))chooseSchool(active);
</script></body></html>
