<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trayectoria · Presentación</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7f8;color:#15374a}header{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #dbe5e8}header strong{margin-right:auto}.tag,.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900}.tag{background:#fff3d8;color:#805600}.btn{background:#e7edef;color:#15374a;cursor:pointer}main{max-width:1050px;margin:auto;padding:18px 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid #dbe5e8;border-radius:16px;padding:15px}.stat b{display:block;font-size:1.5rem}.card{margin-top:12px;border-left:4px solid #83ded3}.stage{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf1f3}.pending{color:#9a6500}.ok{color:#167557}.grade{padding:10px;border-radius:10px;background:#edf5f6;font-weight:900;margin-top:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><span class="tag">PRESENTACIÓN</span><strong>Trayectoria del estudiante</strong><button class="btn" onclick="location.href='presentacion.html'">← Inicio</button></header><main><h1>Fran Demo</h1><section id="stats" class="stats"></section><div id="body"></div></main><script>(function(){var ST=['Punto de partida','Indagación','Producción','Evaluación'];function $(x){return document.getElementById(x)}function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}var design=read('pciDemoPlanDesignV1_school_1',{plans:{}}),db=read('pciDemoAssessmentV1_school_1',{plans:{}});function score(st,p,s){var cs=p.criteria[s]||[];if(!cs.length)return 0;var sum=0;cs.forEach(function(c,i){sum+=Number(st.scores&&st.scores[s]&&st.scores[s][i]!==undefined?st.scores[s][i]:0)});return sum/cs.length*Number(p.weights[s]||0)/10}function total(st,p){return ST.reduce(function(a,s){return a+score(st,p,s)},0)}var rows=[];Object.keys(db.plans||{}).forEach(function(k){var p=design.plans[k],st=(db.plans[k].students||[]).filter(function(x){return x.name==='Fran Demo'})[0];if(p&&st)rows.push({k:k,p:p,st:st})});var complete=0,pending=0;rows.forEach(function(r){var all=true;ST.forEach(function(s){(r.p.criteria[s]||[]).forEach(function(c,i){if(!(r.st.scores&&r.st.scores[s]&&typeof r.st.scores[s][i]==='number')){all=false;pending++}})});if(all)complete++});$('stats').innerHTML='<div class="stat"><span>Planes</span><b>'+rows.length+'</b></div><div class="stat"><span>Completos</span><b>'+complete+'</b></div><div class="stat"><span>En proceso</span><b>'+(rows.length-complete)+'</b></div><div class="stat"><span>Pendientes</span><b>'+pending+'</b></div>';$('body').innerHTML=rows.map(function(r){var t=total(r.st,r.p),html='<article class="card"><h2>'+r.p.name+'</h2>';ST.forEach(function(s){var miss=(r.p.criteria[s]||[]).filter(function(c,i){return !(r.st.scores&&r.st.scores[s]&&typeof r.st.scores[s][i]==='number')});html+='<div class="stage"><b>'+s+'</b><span>'+score(r.st,r.p,s).toFixed(2)+' / '+r.p.weights[s]+'</span></div>'+(miss.length?'<ul class="pending">'+miss.map(function(c){return'<li>Falta evaluar: '+c.name+'</li>'}).join('')+'</ul>':'<div class="ok">Etapa completa</div>')});return html+'<div class="grade">Total: '+t.toFixed(2)+' / 100 · '+(t<60?'En proceso':'Finalizado · '+Math.round(t/10))+'</div></article>'}).join('')})();</script></body></html>
