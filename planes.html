<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes de aprendizaje</title><style>:root{--ink:#15374a;--mint:#83ded3;--bg:#f4f7f8;--line:#dbe5e8;--muted:#687985;--card:#fff;--warn:#9a6500}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}.top strong{margin-right:auto}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer}.btn.primary{background:var(--ink);color:#fff}.btn.mint{background:var(--mint)}main{width:min(1400px,100%);margin:auto;padding:18px 14px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.selectors{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px;margin-bottom:14px}.field label{display:block;font-size:.82rem;font-weight:850;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.plan-head{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:#fff;font-weight:850;cursor:pointer}.tab.active{background:var(--ink);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.student{margin:14px 0}.student-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.student-head input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:10px}.matrix{overflow:auto}.matrix table{width:100%;border-collapse:collapse;min-width:980px}.matrix th,.matrix td{border:1px solid var(--line);padding:8px;vertical-align:top}.matrix th{background:#edf5f6;text-align:left}.criterion{min-width:310px}.desc{font-size:.78rem;color:var(--muted);margin-top:5px}.score{font-weight:900;text-align:center}.total{font-size:1.05rem;font-weight:900;background:#e5f6ef}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.custom{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.custom input{border:1px solid var(--line);border-radius:10px;padding:10px}.note{color:var(--muted);font-size:.88rem}.footer{text-align:center;color:var(--muted);padding:16px}@media(max-width:850px){.selectors,.plan-head{grid-template-columns:1fr}.top strong{width:100%}}</style></head><body><header class="top"><strong>Escuela de Maestros · Planes de aprendizaje</strong><button class="btn" onclick="location.href='launcher.html?v=10'">← Volver a la matriz PCI</button><button id="save" class="btn mint">Guardar</button></header><main><section class="card"><h1>Módulo independiente · Matriz de evaluación</h1><p class="note">Este módulo usa los agrupamientos guardados en la Matriz PCI, pero conserva sus datos en un almacenamiento separado.</p><div class="selectors"><div class="field"><label>Escuela</label><select id="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select></div><div class="field"><label>Área</label><select id="area"></select></div><div class="field"><label>Agrupamiento</label><select id="group"></select></div><div class="field"><label>Plan</label><select id="plan"></select></div></div><div class="plan-head"><div class="field"><label>Nombre del plan</label><input id="planName"></div><div class="field"><label>Valor total de la etapa</label><input id="stageValue" type="number" min="0" max="100" step="0.5" value="10"></div></div><div id="stageTabs" class="tabs"></div><div class="toolbar"><button id="addStudent" class="btn primary">Agregar estudiante</button><button id="print" class="btn">Imprimir matriz</button></div><div id="students"></div></section></main><footer class="footer">Diseñado por Sebastián Giampani</footer><script>
const STAGES=['PUNTO DE PARTIDA','INDAGACIÓN','PRODUCCIÓN','EVALUACIÓN'];const CRITERIA={
'PUNTO DE PARTIDA':[
{name:'Activación de saberes previos',d:['No se registran conocimientos, experiencias ni supuestos previos vinculados a la temática, o la actividad inicial quedó sin resolver; no hay evidencia para valorar el criterio.','Menciona algún conocimiento o experiencia previa vinculada a la temática, de manera aislada y a partir de preguntas del docente; no logra conectarlo con la consigna.','Explicita conocimientos, experiencias o supuestos propios y los vincula con la temática de la consigna, distinguiendo lo que sabe de lo que desconoce.','Revisa sus propios supuestos: distingue lo que creía saber de lo que confirma o corrige con la información nueva, y explica en qué se apoyaba esa idea previa.']},
{name:'Formulación de hipótesis y predicciones de aprendizaje',d:['No formula preguntas ni respuestas tentativas frente a la situación inicial, o la tarea quedó sin resolver; no hay producción que permita valorar el criterio.','Formula preguntas sobre la situación planteada, pero se limita a pedir información o a reformular la consigna; no arriesga respuestas propias.','Plantea hipótesis o respuestas tentativas frente a la problemática inicial y las sostiene con alguna razón, aunque sea provisoria.','Formula hipótesis que exceden la consigna, anticipa cómo podrían verificarse y reconoce qué información necesitaría para confirmarlas o descartarlas.']}
],
'INDAGACIÓN':[
{name:'Búsqueda y selección de información',d:['No consulta fuentes o no queda registro de las consultadas; la búsqueda no llegó a producir información con la que trabajar.','Accede a las fuentes que se le indican y toma de ellas la información más evidente, sin evaluar su pertinencia ni su origen.','Busca en fuentes de distinto tipo, selecciona la información pertinente al problema y consigna de dónde la obtuvo.','Contrasta fuentes entre sí, advierte cuándo se complementan o se contradicen y fundamenta por qué sostiene una versión sobre otra.']},
{name:'Sistematización y análisis',d:['No presenta esquema, resumen ni cuadro, o lo entregado no llega a organizar los datos obtenidos; falta producción para valorar el criterio.','Reúne los datos obtenidos y los transcribe o enumera; los esquemas o cuadros que produce quedan incompletos o no permiten leer la información.','Organiza los datos en el formato solicitado, distingue lo principal de lo secundario y el producto resulta comprensible para otro lector.','Elige la herramienta de organización más adecuada al tipo de dato y justifica esa elección; la sistematización hace visibles relaciones que no estaban explícitas en las fuentes.']},
{name:'Comprensión y rigurosidad',d:['No hay análisis propio de los conceptos o del caso: lo entregado se limita a la copia sin identificación de fuentes, o la tarea quedó sin resolver.','Reproduce definiciones y fragmentos de las fuentes con escasa elaboración propia; usa los conceptos del área de manera imprecisa.','Explica los conceptos clave con palabras propias y los aplica al caso analizado con precisión, citando las fuentes utilizadas.','Analiza el caso poniendo los conceptos en relación entre sí, advierte sus límites o matices y sostiene la interpretación con referencias precisas.']}
],
'PRODUCCIÓN':[
{name:'Producción individual',d:['La producción individual no fue entregada, o está iniciada sin desarrollo suficiente para valorar la aplicación de los contenidos del área.','Entrega la producción incompleta o cumpliendo sólo algunas de las pautas; aplica los contenidos del área con apoyo sostenido.','Elabora la producción completa según las pautas solicitadas, aplicando con corrección los contenidos y procedimientos del área.','Resuelve con autonomía y toma decisiones propias sobre el enfoque, el formato o el procedimiento, y puede fundamentarlas.']},
{name:'Trabajo colaborativo',d:['No se registra participación en la producción grupal, o su intervención no llegó a incidir en la tarea común.','Se integra al grupo y cumple la parte que se le asigna, pero su participación depende de que otros organicen la tarea.','Aporta ideas al trabajo grupal, sostiene el rol asumido y colabora con que el grupo alcance el objetivo común en los tiempos previstos.','Contribuye a organizar la tarea del grupo, integra los aportes de sus compañeros y ayuda a resolver desacuerdos sin imponer su posición.']},
{name:'Resolución de situaciones problema',d:['No aborda la situación problema, o el intento no avanza más allá de la lectura de la consigna; no hay procedimiento aplicado que valorar.','Resuelve situaciones análogas a las trabajadas en clase siguiendo el procedimiento mostrado, con errores en su aplicación.','Selecciona el procedimiento adecuado a la situación y usa con corrección los conceptos y el lenguaje disciplinar requeridos.','Resuelve situaciones nuevas, ensaya otro camino cuando el primero no funciona y explica por qué el procedimiento elegido es pertinente.']}
],
'EVALUACIÓN':[
{name:'Contextualización y transferencia',d:['No establece vínculos entre los contenidos y situaciones de su entorno, o la actividad de transferencia quedó sin resolver.','Menciona ejemplos de su entorno, pero los presenta separados del contenido trabajado o sin explicitar la relación.','Vincula los conocimientos del área con situaciones de su entorno, su realidad social o su contexto personal, explicando en qué consiste esa relación.','Reconoce en una situación nueva de su contexto el problema estudiado, y señala qué del contenido explica esa situación y qué queda fuera de su alcance.']},
{name:'Integración en proyectos de aplicación',d:['No utiliza lo aprendido en el desafío o proyecto, o su participación no llegó a concretarse en un aporte o una decisión identificable.','Participa del proyecto o del desafío práctico aplicando lo aprendido de manera parcial y con indicaciones paso a paso.','Utiliza los contenidos trabajados como insumo para resolver el desafío o diseñar el proyecto, y fundamenta las decisiones que toma.','Integra contenidos de distintos momentos del plan —o de otras áreas— para sostener el proyecto, y anticipa las consecuencias de las decisiones que propone.']},
{name:'Comunicación y exposición',d:['No expuso ni entregó la comunicación de sus conclusiones, o lo presentado no permite reconocer qué aprendió.','Comunica sus conclusiones de manera fragmentaria o leyendo lo escrito; el orden de la exposición dificulta seguir el razonamiento.','Expone sus conclusiones y aprendizajes con claridad y estructura, usando el vocabulario del área y adecuándose al formato pedido.','Adecua la exposición al destinatario, sostiene el hilo argumental y responde repreguntas ampliando o precisando lo dicho.']},
{name:'Metacognición y autorregulación',d:['No hay registro de reflexión sobre el propio proceso, o la instancia de autoevaluación quedó sin completar.','Describe qué hizo durante el proceso y si le resultó fácil o difícil, sin identificar causas ni cambios posibles.','Identifica sus fortalezas y las dificultades que enfrentó, y reconoce qué estrategias le sirvieron para avanzar.','Analiza por qué ciertas estrategias le resultaron y otras no, y formula un plan concreto de mejora para las próximas instancias.']}
]};
let stage=STAGES[0],pci={},db={};const $=id=>document.getElementById(id);const key=()=>`pciPlansV1_school_${$('school').value}`;function loadPCI(){pci=JSON.parse(localStorage.getItem(`pciAppV2_school_${$('school').value}`)||localStorage.getItem('pciAppV2')||'{"areas":{}}');db=JSON.parse(localStorage.getItem(key())||'{"plans":{}}')}
function save(){localStorage.setItem(key(),JSON.stringify(db));$('save').textContent='Guardado';setTimeout(()=>$('save').textContent='Guardar',900)}function areas(){return Object.keys(pci.areas||{})}function currentGroup(){return pci.areas?.[$('area').value]?.groups?.[+$('group').value]}function planCount(){const a=$('area').value;return a==='Ciencias Sociales'||a==='Ciencias Naturales'||a==='Artes'||a==='Tecnologías'||a==='Educación Física'?2:4}function planKey(){return[$('area').value,$('group').value,$('plan').value].join('|')}function ensurePlan(){const k=planKey();if(!db.plans[k])db.plans[k]={name:`Plan ${+$('plan').value+1}`,values:Object.fromEntries(STAGES.map(s=>[s,10])),students:[]};return db.plans[k]}
function renderSelectors(){const as=areas();$('area').innerHTML=as.length?as.map(a=>`<option>${a}</option>`).join(''):'<option value="">Sin áreas iniciadas</option>';renderGroups()}function renderGroups(){const gs=pci.areas?.[$('area').value]?.groups||[];$('group').innerHTML=gs.map((g,i)=>`<option value="${i}">${g.name}</option>`).join('');renderPlans()}function renderPlans(){const n=planCount();$('plan').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i}">Plan ${i+1}</option>`).join('');render()}
function render(){if(!$('area').value||!currentGroup()){$('students').innerHTML='<div class="empty">Primero iniciá un área y un agrupamiento en la Matriz PCI.</div>';return}const p=ensurePlan();$('planName').value=p.name;$('stageValue').value=p.values[stage]??10;$('stageTabs').innerHTML=STAGES.map(s=>`<button class="tab ${s===stage?'active':''}" data-stage="${s}">${s}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;render()});renderStudents()}
function criterionList(st){return[...(CRITERIA[stage]||[]),...(st.custom?.[stage]||[]).map(name=>({name,d:['Criterio personalizado','','','']}))]}
function renderStudents(){const p=ensurePlan();if(!p.students.length){$('students').innerHTML='<div class="empty">Todavía no hay estudiantes cargados.</div>';return}$('students').innerHTML=p.students.map((st,si)=>{st.custom=st.custom||{};st.custom[stage]=st.custom[stage]||[];st.criteria=st.criteria||{};st.criteria[stage]=st.criteria[stage]||{};const rows=criterionList(st).map((c,ci)=>{const v=st.criteria[stage][c.name];return `<tr><td class="criterion"><label><input type="checkbox" data-use="${si}|${encodeURIComponent(c.name)}" ${v!==undefined?'checked':''}> <b>${c.name}</b></label><div class="desc">${c.d[2]||c.d[0]}</div></td><td><select data-score="${si}|${encodeURIComponent(c.name)}" ${v===undefined?'disabled':''}><option value="">Sin evaluar</option><option value="0" ${v===0?'selected':''}>En proceso</option><option value="6.5" ${v===6.5?'selected':''}>Iniciado (6–7)</option><option value="8.5" ${v===8.5?'selected':''}>Suficiente (8–9)</option><option value="10" ${v===10?'selected':''}>Avanzado (10)</option></select></td><td class="score">${v===undefined||v===''?'—':v}</td></tr>`}).join('');return `<article class="student card"><div class="student-head"><input data-name="${si}" value="${st.name||''}" placeholder="Nombre del estudiante"><button class="btn" data-remove="${si}">Eliminar</button></div><div class="matrix"><table><thead><tr><th>Criterio elegido para este estudiante</th><th>Nivel de logro</th><th>Puntaje</th></tr></thead><tbody>${rows}<tr><td colspan="2" class="total">TOTAL DE LA ETAPA</td><td class="total">${total(st).toFixed(2)}</td></tr></tbody></table></div><div class="custom"><input data-custom="${si}" placeholder="Agregar criterio personalizado para este estudiante"><button class="btn mint" data-addcustom="${si}">Agregar criterio</button></div></article>`}).join('');bindStudents()}
function total(st){const vals=Object.values(st.criteria?.[stage]||{}).filter(v=>typeof v==='number');if(!vals.length)return 0;return vals.reduce((a,b)=>a+b,0)/vals.length*(+ensurePlan().values[stage]||0)/10}
function bindStudents(){document.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{ensurePlan().students[+e.dataset.name].name=e.value;save()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{ensurePlan().students.splice(+e.dataset.remove,1);save();renderStudents()});document.querySelectorAll('[data-use]').forEach(e=>e.onchange=()=>{const[i,n]=e.dataset.use.split('|'),name=decodeURIComponent(n),st=ensurePlan().students[+i];if(e.checked)st.criteria[stage][name]='';else delete st.criteria[stage][name];save();renderStudents()});document.querySelectorAll('[data-score]').forEach(e=>e.onchange=()=>{const[i,n]=e.dataset.score.split('|'),name=decodeURIComponent(n),st=ensurePlan().students[+i];st.criteria[stage][name]=e.value===''?'':+e.value;save();renderStudents()});document.querySelectorAll('[data-addcustom]').forEach(e=>e.onclick=()=>{const i=+e.dataset.addcustom,input=document.querySelector(`[data-custom="${i}"]`),name=input.value.trim();if(!name)return;const st=ensurePlan().students[i];st.custom[stage].push(name);st.criteria[stage][name]='';save();renderStudents()})}
$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=()=>{loadPCI();renderSelectors()};$('area').onchange=renderGroups;$('group').onchange=renderPlans;$('plan').onchange=render;$('planName').oninput=()=>{ensurePlan().name=$('planName').value;save()};$('stageValue').oninput=()=>{ensurePlan().values[stage]=+$('stageValue').value;save();renderStudents()};$('addStudent').onclick=()=>{ensurePlan().students.push({name:'',criteria:{},custom:{}});save();renderStudents()};$('save').onclick=save;$('print').onclick=()=>print();loadPCI();renderSelectors();
</script></body></html>
