<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes de aprendizaje</title><style>
:root{--ink:#15374a;--mint:#83ded3;--bg:#f4f7f8;--line:#dbe5e8;--muted:#687985;--ok:#167557;--bad:#b52f48;--warn:#9a6500}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}.top strong{margin-right:auto}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer}.btn.primary{background:var(--ink);color:#fff}.btn.mint{background:var(--mint)}.btn.danger{background:#ffe9ee;color:var(--bad)}main{width:min(1450px,100%);margin:auto;padding:18px 14px 80px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.note{color:var(--muted);font-size:.9rem}.selectors{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px;margin-bottom:14px}.field label{display:block;font-size:.83rem;font-weight:850;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:95px;resize:vertical}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:#fff;font-weight:850;cursor:pointer}.tab.active{background:var(--ink);color:#fff}.panel{display:none}.panel.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{display:grid;gap:8px}.choice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fbfcfc}.choice input{width:19px;height:19px}.custom-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}.custom-row input{border:1px solid var(--line);border-radius:10px;padding:10px}.stage-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.stage-btn{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-weight:850}.stage-btn.active{background:var(--mint)}.weights{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.weight-status{padding:12px;border-radius:12px;font-weight:900;margin:12px 0}.weight-status.ok{background:#e5f6ef;color:var(--ok)}.weight-status.warn{background:#fff3d8;color:var(--warn)}.weight-status.bad{background:#ffe9ee;color:var(--bad)}.criterion-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.criterion-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.criterion-head input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:850}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.levels textarea{width:100%;min-height:115px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.82rem}.levels label{display:block;font-size:.78rem;font-weight:850;margin-bottom:4px}.student-card{margin:12px 0}.student-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.student-head input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:10px}.matrix{overflow:auto;margin-top:10px}.matrix table{width:100%;border-collapse:collapse;min-width:900px}.matrix th,.matrix td{border:1px solid var(--line);padding:8px;vertical-align:top}.matrix th{background:#edf5f6}.score{font-weight:900;text-align:center}.summary-table{width:100%;border-collapse:collapse}.summary-table th,.summary-table td{border:1px solid var(--line);padding:8px}.summary-table th{background:#edf5f6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.footer{text-align:center;color:var(--muted);padding:16px}@media(max-width:900px){.selectors,.grid2,.weights,.levels{grid-template-columns:1fr}.top strong{width:100%}}
</style></head><body><header class="top"><strong>Escuela de Maestros · Planes de aprendizaje</strong><button class="btn" onclick="location.href='launcher.html?v=10'">← Volver a la Matriz PCI</button><button id="save" class="btn mint">Guardar</button></header><main><section class="card"><h1>Planes de aprendizaje</h1><p class="note">Lee los agrupamientos de la Matriz PCI, pero guarda toda la información de los planes por separado. Nada de lo que edites aquí modifica la matriz original.</p><div class="selectors"><div class="field"><label>Escuela</label><select id="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select></div><div class="field"><label>Área</label><select id="area"></select></div><div class="field"><label>Agrupamiento</label><select id="group"></select></div><div class="field"><label>Plan</label><select id="plan"></select></div></div><div id="mainTabs" class="tabs"><button class="tab active" data-panel="config">1. Configuración</button><button class="tab" data-panel="stages">2. Etapas y criterios</button><button class="tab" data-panel="students">3. Estudiantes</button><button class="tab" data-panel="summary">4. Totales</button></div><div id="config" class="panel active"></div><div id="stages" class="panel"></div><div id="students" class="panel"></div><div id="summary" class="panel"></div></section></main><footer class="footer">Diseñado por Sebastián Giampani</footer><script>
const STAGES=['PUNTO DE PARTIDA','INDAGACIÓN','PRODUCCIÓN','EVALUACIÓN'];const LEVELS=['En proceso','Iniciado (6–7)','Suficiente (8–9)','Avanzado (10)'];const SCORES=[0,6.5,8.5,10];
const BASE={
'PUNTO DE PARTIDA':[['Activación de saberes previos','No se registran saberes previos vinculados.','Menciona saberes previos de manera aislada.','Vincula saberes previos con la temática.','Revisa y fundamenta sus supuestos previos.'],['Formulación de hipótesis y predicciones','No formula preguntas ni respuestas tentativas.','Formula preguntas sin arriesgar respuestas propias.','Plantea hipótesis y las sostiene con alguna razón.','Formula hipótesis y anticipa cómo verificarlas.']],
'INDAGACIÓN':[['Búsqueda y selección de información','No consulta fuentes o no registra la búsqueda.','Consulta fuentes indicadas sin evaluar pertinencia.','Selecciona información pertinente y consigna fuentes.','Contrasta fuentes y fundamenta sus elecciones.'],['Sistematización y análisis','No organiza los datos obtenidos.','Enumera datos sin una organización suficiente.','Organiza y distingue información principal y secundaria.','Elige y justifica la herramienta de organización.'],['Comprensión y rigurosidad','No hay análisis propio de los conceptos.','Reproduce definiciones con escasa elaboración.','Explica conceptos y los aplica con precisión.','Relaciona conceptos, matices y límites.']],
'PRODUCCIÓN':[['Producción individual','No presenta una producción evaluable.','Entrega una producción parcial con apoyo sostenido.','Completa la producción aplicando los contenidos.','Resuelve con autonomía y fundamenta decisiones.'],['Trabajo colaborativo','No se registra participación en la tarea común.','Cumple una parte asignada con organización externa.','Aporta ideas y sostiene su rol en el grupo.','Organiza, integra aportes y resuelve desacuerdos.'],['Resolución de situaciones problema','No aborda la situación problema.','Aplica procedimientos conocidos con errores.','Selecciona y aplica el procedimiento adecuado.','Resuelve situaciones nuevas y justifica el camino.']],
'EVALUACIÓN':[['Contextualización y transferencia','No vincula contenidos con situaciones del entorno.','Menciona ejemplos sin explicar la relación.','Vincula conocimientos con situaciones de contexto.','Reconoce alcances y límites en situaciones nuevas.'],['Integración en proyectos de aplicación','No utiliza lo aprendido en el proyecto.','Aplica parcialmente con indicaciones paso a paso.','Usa contenidos para resolver y fundamentar decisiones.','Integra contenidos y anticipa consecuencias.'],['Comunicación y exposición','No presenta una comunicación evaluable.','Comunica de forma fragmentaria.','Expone con claridad, estructura y vocabulario adecuado.','Adecua la exposición y responde repreguntas.'],['Metacognición y autorregulación','No registra reflexión sobre el proceso.','Describe lo realizado sin analizar causas.','Identifica fortalezas, dificultades y estrategias.','Analiza estrategias y formula un plan de mejora.']]};
let DATA=[],pci={areas:{}},db={plans:{}},activeStage=STAGES[0];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadBase(){const files=['data/db1.txt','data/db2.txt','data/db3.txt','data/db4.txt','data/rest1.txt','data/rest2.txt','data/rest3.txt','data/rest4.txt','data/rest5.txt'];const b=(await Promise.all(files.map(x=>fetch(x).then(r=>r.text())))).join('');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const text=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();DATA=JSON.parse(text).map(([id,area,subject,axis,text])=>({id,area,subject,axis,text}))}
function storageKey(){return`pciPlansV2_school_${$('school').value}`}function loadSchool(){pci=JSON.parse(localStorage.getItem(`pciAppV2_school_${$('school').value}`)||localStorage.getItem('pciAppV2')||'{"areas":{}}');db=JSON.parse(localStorage.getItem(storageKey())||'{"plans":{}}')}function save(){localStorage.setItem(storageKey(),JSON.stringify(db));$('save').textContent='Guardado';setTimeout(()=>$('save').textContent='Guardar',900)}
function currentGroup(){return pci.areas?.[$('area').value]?.groups?.[+$('group').value]}function planCount(){return['Ciencias Sociales','Ciencias Naturales','Artes','Tecnologías','Educación Física'].includes($('area').value)?2:4}function pkey(){return[$('area').value,$('group').value,$('plan').value].join('|')}
function newCriteria(){return Object.fromEntries(STAGES.map(s=>[s,BASE[s].map((x,i)=>({id:`base-${i}`,name:x[0],levels:x.slice(1)}))]))}function ensurePlan(){const k=pkey();if(!db.plans[k])db.plans[k]={name:`Plan ${+$('plan').value+1}`,synopsis:'',duration:'1 bimestre',time:'',inheritedContents:[],customContents:[],useGroupObjective:true,customObjectives:[],weights:{'PUNTO DE PARTIDA':25,'INDAGACIÓN':25,'PRODUCCIÓN':25,'EVALUACIÓN':25},stages:Object.fromEntries(STAGES.map(s=>[s,{intro:'',duration:'',resources:'',activities:''}])),criteria:newCriteria(),students:[]};const p=db.plans[k];p.criteria=p.criteria||newCriteria();p.students=p.students||[];p.customContents=p.customContents||[];p.customObjectives=p.customObjectives||[];p.inheritedContents=p.inheritedContents||[];p.weights=p.weights||Object.fromEntries(STAGES.map(s=>[s,25]));p.stages=p.stages||Object.fromEntries(STAGES.map(s=>[s,{intro:'',duration:'',resources:'',activities:''}]));return p}
function renderSelectors(){const as=Object.keys(pci.areas||{});$('area').innerHTML=as.length?as.map(a=>`<option>${esc(a)}</option>`).join(''):'<option value="">Sin áreas iniciadas</option>';renderGroups()}function renderGroups(){const gs=pci.areas?.[$('area').value]?.groups||[];$('group').innerHTML=gs.map((g,i)=>`<option value="${i}">${esc(g.name)}</option>`).join('');renderPlans()}function renderPlans(){$('plan').innerHTML=Array.from({length:planCount()},(_,i)=>`<option value="${i}">Plan ${i+1}</option>`).join('');renderAll()}
function inheritedRows(){const g=currentGroup();return(g?.items||[]).map(id=>DATA.find(x=>x.id===id)).filter(Boolean)}
function renderConfig(){const g=currentGroup(),p=ensurePlan(),rows=inheritedRows();$('config').innerHTML=`<div class="grid2"><div class="field"><label>Nombre del plan</label><input id="planName" value="${esc(p.name)}"></div><div class="field"><label>Duración</label><input id="planDuration" value="${esc(p.duration)}"></div><div class="field"><label>Ubicación temporal</label><input id="planTime" value="${esc(p.time)}"></div><div class="field"><label>Sinopsis</label><textarea id="synopsis">${esc(p.synopsis)}</textarea></div></div><h2>Contenidos heredados del agrupamiento</h2><p class="note">Se leen desde la Matriz PCI. Seleccionarlos aquí no modifica el agrupamiento original.</p><div class="list">${rows.length?rows.map(x=>`<label class="choice"><input type="checkbox" data-content="${x.id}" ${p.inheritedContents.includes(x.id)?'checked':''}><span><b>${esc(x.subject)}</b> · ${esc(x.axis||'Sin eje/bloque')}<br>${esc(x.text)}</span></label>`).join(''):'<div class="empty">Este agrupamiento todavía no tiene contenidos asignados.</div>'}</div><h3>Contenidos específicos del plan</h3><div class="list">${p.customContents.map((x,i)=>`<div class="choice"><span>${esc(x)}</span><button class="btn danger" data-rmcontent="${i}">Eliminar</button></div>`).join('')}</div><div class="custom-row"><input id="newContent" placeholder="Agregar contenido específico que solo pertenezca a este plan"><button id="addContent" class="btn mint">Agregar</button></div><h2>Objetivos</h2><label class="choice"><input id="useGroupObjective" type="checkbox" ${p.useGroupObjective?'checked':''}><span><b>Objetivo heredado del agrupamiento</b><br>${esc(g?.objective||'El agrupamiento todavía no tiene un objetivo cargado.')}</span></label><h3>Objetivos específicos del plan</h3><div class="list">${p.customObjectives.map((x,i)=>`<div class="choice"><span>${esc(x)}</span><button class="btn danger" data-rmobjective="${i}">Eliminar</button></div>`).join('')}</div><div class="custom-row"><input id="newObjective" placeholder="Agregar objetivo específico"><button id="addObjective" class="btn mint">Agregar</button></div>`;bindConfig()}
function bindConfig(){const p=ensurePlan();['planName','planDuration','planTime','synopsis'].forEach(id=>$(id).oninput=()=>{const map={planName:'name',planDuration:'duration',planTime:'time',synopsis:'synopsis'};p[map[id]]=$(id).value;save()});document.querySelectorAll('[data-content]').forEach(e=>e.onchange=()=>{p.inheritedContents=e.checked?[...new Set([...p.inheritedContents,e.dataset.content])]:p.inheritedContents.filter(x=>x!==e.dataset.content);save()});$('useGroupObjective').onchange=()=>{p.useGroupObjective=$('useGroupObjective').checked;save()};$('addContent').onclick=()=>{const v=$('newContent').value.trim();if(v){p.customContents.push(v);save();renderConfig()}};$('addObjective').onclick=()=>{const v=$('newObjective').value.trim();if(v){p.customObjectives.push(v);save();renderConfig()}};document.querySelectorAll('[data-rmcontent]').forEach(e=>e.onclick=()=>{p.customContents.splice(+e.dataset.rmcontent,1);save();renderConfig()});document.querySelectorAll('[data-rmobjective]').forEach(e=>e.onclick=()=>{p.customObjectives.splice(+e.dataset.rmobjective,1);save();renderConfig()})}
function weightTotal(){return STAGES.reduce((a,s)=>a+(+ensurePlan().weights[s]||0),0)}function weightClass(){const t=weightTotal();return t>100?'bad':t===100?'ok':'warn'}
function renderStages(){const p=ensurePlan(),st=p.stages[activeStage],criteria=p.criteria[activeStage];$('stages').innerHTML=`<h2>Valor de las etapas</h2><div class="weights">${STAGES.map(s=>`<div class="field"><label>${s}</label><input type="number" min="0" max="100" step="0.5" data-weight="${s}" value="${p.weights[s]}"></div>`).join('')}</div><div class="weight-status ${weightClass()}">Total asignado: ${weightTotal()} / 100 · Disponible: ${Math.max(0,100-weightTotal())}</div><div class="stage-nav">${STAGES.map(s=>`<button class="stage-btn ${s===activeStage?'active':''}" data-stage="${s}">${s}</button>`).join('')}</div><div class="grid2"><div class="field"><label>Encabezado para estudiantes</label><textarea id="stageIntro">${esc(st.intro)}</textarea></div><div class="field"><label>Duración estimada</label><input id="stageDuration" value="${esc(st.duration)}"><label style="margin-top:10px">Recursos</label><textarea id="stageResources">${esc(st.resources)}</textarea></div></div><div class="field"><label>Actividades</label><textarea id="stageActivities" style="min-height:150px">${esc(st.activities)}</textarea></div><h2>Criterios editables de ${activeStage}</h2><p class="note">Los criterios y los cuatro niveles de logro son plantillas. Todo puede editarse para este plan.</p><div>${criteria.map((c,i)=>criterionHTML(c,i)).join('')}</div><button id="addCriterion" class="btn mint">Agregar criterio</button>`;bindStages()}
function criterionHTML(c,i){return `<article class="criterion-card"><div class="criterion-head"><input data-cname="${i}" value="${esc(c.name)}"><button class="btn danger" data-rmcriterion="${i}">Eliminar</button></div><div class="levels">${LEVELS.map((l,j)=>`<div><label>${l}</label><textarea data-level="${i}|${j}">${esc(c.levels[j]||'')}</textarea></div>`).join('')}</div></article>`}
function bindStages(){const p=ensurePlan(),st=p.stages[activeStage];document.querySelectorAll('[data-weight]').forEach(e=>e.onchange=()=>{const old=p.weights[e.dataset.weight],v=+e.value||0;p.weights[e.dataset.weight]=v;if(weightTotal()>100){p.weights[e.dataset.weight]=old;alert('La suma de las cuatro etapas no puede superar 100.')}save();renderStages();renderSummary()});document.querySelectorAll('[data-stage]').forEach(e=>e.onclick=()=>{activeStage=e.dataset.stage;renderStages()});['stageIntro','stageDuration','stageResources','stageActivities'].forEach(id=>$(id).oninput=()=>{const map={stageIntro:'intro',stageDuration:'duration',stageResources:'resources',stageActivities:'activities'};st[map[id]]=$(id).value;save()});document.querySelectorAll('[data-cname]').forEach(e=>e.oninput=()=>{p.criteria[activeStage][+e.dataset.cname].name=e.value;save()});document.querySelectorAll('[data-level]').forEach(e=>e.oninput=()=>{const[i,j]=e.dataset.level.split('|').map(Number);p.criteria[activeStage][i].levels[j]=e.value;save()});document.querySelectorAll('[data-rmcriterion]').forEach(e=>e.onclick=()=>{p.criteria[activeStage].splice(+e.dataset.rmcriterion,1);save();renderStages();renderStudents()});$('addCriterion').onclick=()=>{p.criteria[activeStage].push({id:'custom-'+Date.now(),name:'Nuevo criterio',levels:['','','','']});save();renderStages();renderStudents()}}
function ensureStudent(st){st.scores=st.scores||{};st.enabled=st.enabled||{};STAGES.forEach(s=>{st.scores[s]=st.scores[s]||{};st.enabled[s]=st.enabled[s]||{}})}function stageScore(st,s){ensureStudent(st);const p=ensurePlan(),cs=p.criteria[s].filter(c=>st.enabled[s][c.id]!==false),vals=cs.map(c=>st.scores[s][c.id]).filter(v=>typeof v==='number');if(!vals.length)return 0;return(vals.reduce((a,b)=>a+b,0)/vals.length)*(+p.weights[s]||0)/10}function totalScore(st){return STAGES.reduce((a,s)=>a+stageScore(st,s),0)}
function renderStudents(){const p=ensurePlan();$('students').innerHTML=`<div class="stage-nav">${STAGES.map(s=>`<button class="stage-btn ${s===activeStage?'active':''}" data-studentstage="${s}">${s}</button>`).join('')}</div><div class="toolbar"><button id="addStudent" class="btn primary">Agregar estudiante</button></div>${p.students.length?p.students.map((st,si)=>studentHTML(st,si)).join(''):'<div class="empty">Todavía no hay estudiantes cargados.</div>'}`;bindStudents()}
function studentHTML(st,si){ensureStudent(st);const cs=ensurePlan().criteria[activeStage];return `<article class="student-card card"><div class="student-head"><input data-studentname="${si}" value="${esc(st.name||'')}" placeholder="Nombre del estudiante"><button class="btn danger" data-rmstudent="${si}">Eliminar</button></div><h3>${activeStage} · máximo ${ensurePlan().weights[activeStage]} puntos</h3><div class="matrix"><table><thead><tr><th>Usar</th><th>Criterio</th><th>Nivel de logro</th><th>Puntaje base</th></tr></thead><tbody>${cs.map(c=>{const enabled=st.enabled[activeStage][c.id]!==false,v=st.scores[activeStage][c.id];return `<tr><td><input type="checkbox" data-enable="${si}|${c.id}" ${enabled?'checked':''}></td><td><b>${esc(c.name)}</b></td><td><select data-score="${si}|${c.id}" ${enabled?'':'disabled'}><option value="">Sin evaluar</option>${LEVELS.map((l,j)=>`<option value="${SCORES[j]}" ${v===SCORES[j]?'selected':''}>${l}</option>`).join('')}</select></td><td class="score">${typeof v==='number'?v:'—'}</td></tr>`}).join('')}<tr><td colspan="3"><b>Subtotal de la etapa</b></td><td class="score">${stageScore(st,activeStage).toFixed(2)} / ${ensurePlan().weights[activeStage]}</td></tr></tbody></table></div></article>`}
function bindStudents(){const p=ensurePlan();document.querySelectorAll('[data-studentstage]').forEach(e=>e.onclick=()=>{activeStage=e.dataset.studentstage;renderStudents()});$('addStudent').onclick=()=>{p.students.push({name:'',scores:{},enabled:{}});save();renderStudents();renderSummary()};document.querySelectorAll('[data-studentname]').forEach(e=>e.oninput=()=>{p.students[+e.dataset.studentname].name=e.value;save();renderSummary()});document.querySelectorAll('[data-rmstudent]').forEach(e=>e.onclick=()=>{p.students.splice(+e.dataset.rmstudent,1);save();renderStudents();renderSummary()});document.querySelectorAll('[data-enable]').forEach(e=>e.onchange=()=>{const[i,id]=e.dataset.enable.split('|'),st=p.students[+i];ensureStudent(st);st.enabled[activeStage][id]=e.checked;if(!e.checked)delete st.scores[activeStage][id];save();renderStudents();renderSummary()});document.querySelectorAll('[data-score]').forEach(e=>e.onchange=()=>{const[i,id]=e.dataset.score.split('|'),st=p.students[+i];ensureStudent(st);if(e.value==='')delete st.scores[activeStage][id];else st.scores[activeStage][id]=+e.value;save();renderStudents();renderSummary()})}
function renderSummary(){const p=ensurePlan();$('summary').innerHTML=`<h2>Totales del plan</h2><div class="weight-status ${weightClass()}">Valor máximo del plan: ${weightTotal()} / 100</div>${p.students.length?`<div class="matrix"><table class="summary-table"><thead><tr><th>Estudiante</th>${STAGES.map(s=>`<th>${s}<br><small>Máx. ${p.weights[s]}</small></th>`).join('')}<th>Total</th><th>Porcentaje</th></tr></thead><tbody>${p.students.map(st=>`<tr><td>${esc(st.name||'Sin nombre')}</td>${STAGES.map(s=>`<td>${stageScore(st,s).toFixed(2)}</td>`).join('')}<td><b>${totalScore(st).toFixed(2)} / ${weightTotal()}</b></td><td>${weightTotal()?((totalScore(st)/weightTotal())*100).toFixed(1):'0'}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Agregá estudiantes para ver los totales.</div>'}`}
function renderAll(){if(!$('area').value||!currentGroup()){$('config').innerHTML='<div class="empty">Primero iniciá un área y un agrupamiento en la Matriz PCI.</div>';$('stages').innerHTML='';$('students').innerHTML='';$('summary').innerHTML='';return}ensurePlan();renderConfig();renderStages();renderStudents();renderSummary()}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.panel))});$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=()=>{loadSchool();renderSelectors()};$('area').onchange=renderGroups;$('group').onchange=renderPlans;$('plan').onchange=renderAll;$('save').onclick=save;(async()=>{await loadBase();loadSchool();renderSelectors()})().catch(e=>{console.error(e);$('config').innerHTML='<div class="empty">No se pudo cargar la base de contenidos.</div>'});
</script></body></html>
