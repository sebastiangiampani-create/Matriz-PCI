<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes · Plataforma PCI</title><style>:root{--ink:#15374a;--mint:#83ded3;--bg:#f4f7f8;--line:#dbe5e8;--muted:#687985;--ok:#167557;--warn:#9a6500;--empty:#8b98a1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}.identity{display:flex;align-items:center;gap:9px;margin-right:auto}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mint);font-weight:950}.identity small{display:block;color:var(--muted);font-weight:800}.identity strong{display:block}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer;text-decoration:none}.btn.active{background:var(--ink);color:#fff}.school{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;font-weight:800}main{width:min(1100px,100%);margin:auto;padding:20px 14px 80px}.intro{color:var(--muted);max-width:780px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.area{background:#fff;border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}.area summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:16px;cursor:pointer;font-weight:900}.area summary::-webkit-details-marker{display:none}.area summary:hover{background:#f8fbfb}.area-name{font-size:1.08rem}.area-meta{font-size:.82rem;color:var(--muted);font-weight:800}.summary-stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.stat{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:.75rem;font-weight:900}.stat.ok{background:#e5f6ef;color:var(--ok)}.stat.warn{background:#fff3d8;color:var(--warn)}.stat.empty{background:#edf1f3;color:var(--empty)}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.chevron{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#edf5f6;transition:transform .2s}.area[open] .chevron{transform:rotate(180deg);background:var(--mint)}.area-body{padding:0 16px 16px;border-top:1px solid var(--line)}.groups{display:grid;gap:10px;margin-top:14px}.group{border-left:4px solid var(--mint);background:#f8fbfb;border-radius:0 14px 14px 0;padding:12px 12px 12px 16px}.group-title{font-weight:900;margin-bottom:9px}.plans{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:8px}.plan{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 10px;text-align:left;color:var(--ink);font-weight:900;cursor:pointer}.plan:hover{border-color:var(--mint);background:#effaf8}.plan small{display:block;color:var(--muted);font-weight:700;margin-top:3px}.plan-state{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%}.plan-state.ok{background:var(--ok)}.plan-state.warn{background:#e4a11b}.plan-state.empty{background:#c7d0d5}footer{text-align:center;color:var(--muted);padding:16px}@media(max-width:820px){.identity{width:100%}.nav{width:100%;overflow:auto}.plans{grid-template-columns:repeat(2,1fr)}.area summary{grid-template-columns:minmax(0,1fr) auto}.area-meta{grid-column:1}.chevron{grid-column:2;grid-row:1 / span 2}}</style></head><body><header class="top"><div class="identity"><div class="logo">EM</div><div><small>Escuela de Maestros</small><strong>Plataforma PCI</strong></div></div><select id="school" class="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select><nav class="nav"><a class="btn" href="plataforma.html">Inicio</a><a class="btn" href="launcher.html?v=10">Matriz PCI</a><a class="btn active" href="planes-arbol.html">Planes</a><a class="btn" href="evaluacion.html">Evaluación</a><a class="btn" href="trayectoria.html">Trayectoria</a></nav></header><main><h1>Constructor de Planes</h1><p class="intro">Seleccioná un área, un agrupamiento y un plan para definir su información, sus contenidos, sus objetivos y la rúbrica de evaluación.</p><div class="tools"><button id="openAll" class="btn">Abrir todas</button><button id="closeAll" class="btn">Cerrar todas</button></div><div id="tree"></div></main><footer>Diseñado por Sebastián Giampani</footer><script>
const RULES={'Lengua y Literatura':{count:5,label:'Nivel',plans:4},'Matemática':{count:5,label:'Nivel',plans:4},'Lenguas Adicionales':{count:5,label:'Nivel',plans:4},'Ciencias Sociales':{count:9,label:'Laboratorio',plans:2},'Ciencias Naturales':{count:9,label:'Laboratorio',plans:2},'Artes':{count:6,label:'Taller',plans:2},'Tecnologías':{count:6,label:'Taller',plans:2},'Educación Física':{count:10,label:'Taller',plans:2}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||fallback)}catch{return JSON.parse(fallback)}}
function readMatrix(school){return readJSON(`pciAppV2_school_${school}`,localStorage.getItem('pciAppV2')||'{"areas":{}}')}
function readDesign(school){return readJSON(`pciPlanDesignV1_school_${school}`,'{"plans":{}}')}
function planStatus(plan){if(!plan)return'empty';const named=(plan.name||'').trim()&&!/^Plan \d+$/.test((plan.name||'').trim());const hasText=(plan.synopsis||'').trim()||(plan.duration||'').trim()||(plan.time||'').trim()||(plan.customContents||[]).length||(plan.customObjectives||[]).length;const weights=Object.values(plan.weights||{}).reduce((a,b)=>a+(+b||0),0);const criteria=Object.values(plan.criteria||{}).flat();const rubricComplete=weights===100&&criteria.length>0&&criteria.every(c=>(c.name||'').trim()&&(c.levels||[]).length===4&&(c.levels||[]).every(x=>(x||'').trim()));return rubricComplete&&(named||hasText)?'ok':'warn'}
function render(){const school=$('school').value,matrix=readMatrix(school),design=readDesign(school),remembered=localStorage.getItem('pciPlansOpenArea')||'';$('tree').innerHTML=Object.entries(RULES).map(([area,rule])=>{const saved=matrix.areas?.[area]?.groups||[];const groups=Array.from({length:rule.count},(_,i)=>saved[i]||{name:`${rule.label} ${i+1}`});const label=rule.label==='Nivel'?'niveles':rule.label==='Taller'?'talleres':'laboratorios';const statuses=[];for(let gi=0;gi<rule.count;gi++)for(let pi=0;pi<rule.plans;pi++)statuses.push(planStatus(design.plans?.[`${area}|${gi}|${pi}`]));const totals={ok:statuses.filter(x=>x==='ok').length,warn:statuses.filter(x=>x==='warn').length,empty:statuses.filter(x=>x==='empty').length};return `<details class="area" data-area-box="${esc(area)}" ${remembered===area?'open':''}><summary><span><span class="area-name">${esc(area)}</span><span class="summary-stats"><span class="stat ok"><span class="dot"></span>${totals.ok} completos</span><span class="stat warn"><span class="dot"></span>${totals.warn} en proceso</span><span class="stat empty"><span class="dot"></span>${totals.empty} vacíos</span></span></span><span class="area-meta">${rule.count} ${label} · ${rule.count*rule.plans} planes</span><span class="chevron">⌄</span></summary><div class="area-body"><div class="groups">${groups.map((g,gi)=>`<article class="group"><div class="group-title">${esc(g.name||`${rule.label} ${gi+1}`)}</div><div class="plans">${Array.from({length:rule.plans},(_,pi)=>{const status=planStatus(design.plans?.[`${area}|${gi}|${pi}`]);const text=status==='ok'?'Diseño completo':status==='warn'?'En construcción':'Vacío';return `<button class="plan" data-area="${esc(area)}" data-group="${gi}" data-plan="${pi}"><span class="plan-state ${status}"></span>Plan ${pi+1}<small>${text}</small></button>`}).join('')}</div></article>`).join('')}</div></div></details>`}).join('');document.querySelectorAll('.area').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)localStorage.setItem('pciPlansOpenArea',d.dataset.areaBox);else if(localStorage.getItem('pciPlansOpenArea')===d.dataset.areaBox)localStorage.removeItem('pciPlansOpenArea')}));document.querySelectorAll('.plan').forEach(b=>b.onclick=()=>{const q=new URLSearchParams({school,area:b.dataset.area,group:b.dataset.group,plan:b.dataset.plan});location.href=`constructor-plan.html?${q}`})}
$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=()=>{localStorage.setItem('pciActiveSchool',$('school').value);localStorage.removeItem('pciPlansOpenArea');render()};$('openAll').onclick=()=>document.querySelectorAll('.area').forEach(d=>d.open=true);$('closeAll').onclick=()=>{document.querySelectorAll('.area').forEach(d=>d.open=false);localStorage.removeItem('pciPlansOpenArea')};render();
</script></body></html>
