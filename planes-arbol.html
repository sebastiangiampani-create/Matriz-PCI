<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes de aprendizaje</title><style>:root{--ink:#15374a;--mint:#83ded3;--bg:#f4f7f8;--line:#dbe5e8;--muted:#687985;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:900;margin-right:auto}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer}.school{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;font-weight:800}main{width:min(1300px,100%);margin:auto;padding:20px 14px 80px}.intro{color:var(--muted);max-width:780px}.area{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:16px 0}.area-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.area h2{margin:0}.area-meta{font-size:.85rem;color:var(--muted);font-weight:800}.groups{display:grid;gap:12px;margin-top:14px}.group{position:relative;border-left:4px solid var(--mint);background:#f8fbfb;border-radius:0 14px 14px 0;padding:12px 12px 12px 16px}.group:before{content:"";position:absolute;left:-4px;top:-12px;width:22px;height:12px;border-left:2px solid #b9d8d4;border-bottom:2px solid #b9d8d4}.group:first-child:before{display:none}.group-title{font-weight:900;margin-bottom:9px}.plans{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:8px}.plan{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 10px;text-align:left;color:var(--ink);font-weight:900;cursor:pointer}.plan:hover{border-color:var(--mint);background:#effaf8}.plan small{display:block;color:var(--muted);font-weight:700;margin-top:3px}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:16px}@media(max-width:700px){.top{align-items:flex-start}.brand{width:100%}.plans{grid-template-columns:repeat(2,1fr)}.area-head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><div class="brand">Escuela de Maestros · Planes de aprendizaje</div><select id="school" class="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select><button class="btn" onclick="location.href='launcher.html?v=10'">← Volver a Matriz PCI</button></header><main><h1>Árbol de agrupamientos y planes</h1><p class="intro">Elegí un plan desde su agrupamiento. Los nombres se toman de la Matriz PCI. Los niveles tienen cuatro planes; los laboratorios y talleres tienen dos.</p><div id="tree"></div></main><footer>Diseñado por Sebastián Giampani</footer><script>
const RULES={
'Lengua y Literatura':{count:5,label:'Nivel',plans:4},
'Matemática':{count:5,label:'Nivel',plans:4},
'Lenguas Adicionales':{count:5,label:'Nivel',plans:4},
'Ciencias Sociales':{count:9,label:'Laboratorio',plans:2},
'Ciencias Naturales':{count:9,label:'Laboratorio',plans:2},
'Artes':{count:6,label:'Taller',plans:2},
'Tecnologías':{count:6,label:'Taller',plans:2},
'Educación Física':{count:10,label:'Taller',plans:2}
};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readMatrix(school){try{return JSON.parse(localStorage.getItem(`pciAppV2_school_${school}`)||localStorage.getItem('pciAppV2')||'{"areas":{}}')}catch{return{areas:{}}}}
function render(){const school=$('school').value,matrix=readMatrix(school);$('tree').innerHTML=Object.entries(RULES).map(([area,rule])=>{const saved=matrix.areas?.[area]?.groups||[];const groups=Array.from({length:rule.count},(_,i)=>saved[i]||{name:`${rule.label} ${i+1}`});return `<section class="area"><div class="area-head"><h2>${esc(area)}</h2><div class="area-meta">${rule.count} ${rule.label==='Nivel'?'niveles':rule.label==='Taller'?'talleres':'laboratorios'}</div></div><div class="groups">${groups.map((g,gi)=>`<article class="group"><div class="group-title">${esc(g.name||`${rule.label} ${gi+1}`)}</div><div class="plans">${Array.from({length:rule.plans},(_,pi)=>`<button class="plan" data-area="${esc(area)}" data-group="${gi}" data-plan="${pi}">Plan ${pi+1}<small>Abrir evaluación</small></button>`).join('')}</div></article>`).join('')}</div></section>`}).join('');document.querySelectorAll('.plan').forEach(b=>b.onclick=()=>{const q=new URLSearchParams({school,area:b.dataset.area,group:b.dataset.group,plan:b.dataset.plan});location.href=`plan-editor.html?${q}`})}
$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=()=>{localStorage.setItem('pciActiveSchool',$('school').value);render()};render();
</script></body></html>
