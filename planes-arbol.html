<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes de aprendizaje</title><style>:root{--ink:#15374a;--mint:#83ded3;--bg:#f4f7f8;--line:#dbe5e8;--muted:#687985;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:900;margin-right:auto}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer}.school{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;font-weight:800}main{width:min(1100px,100%);margin:auto;padding:20px 14px 80px}.intro{color:var(--muted);max-width:780px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.area{background:#fff;border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}.area summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:16px;cursor:pointer;font-weight:900}.area summary::-webkit-details-marker{display:none}.area summary:hover{background:#f8fbfb}.area-name{font-size:1.08rem}.area-meta{font-size:.82rem;color:var(--muted);font-weight:800}.chevron{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#edf5f6;transition:transform .2s}.area[open] .chevron{transform:rotate(180deg);background:var(--mint)}.area-body{padding:0 16px 16px;border-top:1px solid var(--line)}.groups{display:grid;gap:10px;margin-top:14px}.group{border-left:4px solid var(--mint);background:#f8fbfb;border-radius:0 14px 14px 0;padding:12px 12px 12px 16px}.group-title{font-weight:900;margin-bottom:9px}.plans{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:8px}.plan{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 10px;text-align:left;color:var(--ink);font-weight:900;cursor:pointer}.plan:hover{border-color:var(--mint);background:#effaf8}.plan small{display:block;color:var(--muted);font-weight:700;margin-top:3px}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:16px}@media(max-width:700px){.top{align-items:flex-start}.brand{width:100%}.plans{grid-template-columns:repeat(2,1fr)}.area summary{grid-template-columns:minmax(0,1fr) auto}.area-meta{grid-column:1}.chevron{grid-column:2;grid-row:1 / span 2}}</style></head><body><header class="top"><div class="brand">Escuela de Maestros · Planes de aprendizaje</div><select id="school" class="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select><button class="btn" onclick="location.href='launcher.html?v=10'">← Volver a Matriz PCI</button></header><main><h1>Árbol de agrupamientos y planes</h1><p class="intro">Abrí solamente el área que quieras trabajar. Dentro vas a encontrar sus agrupamientos y los planes disponibles.</p><div class="tools"><button id="openAll" class="btn">Abrir todas</button><button id="closeAll" class="btn">Cerrar todas</button></div><div id="tree"></div></main><footer>Diseñado por Sebastián Giampani</footer><script>
const RULES={
'Lengua y Literatura':{count:5,label:'Nivel',plans:4},
'Matemática':{count:5,label:'Nivel',plans:4},
'Lenguas Adicionales':{count:5,label:'Nivel',plans:4},
'Ciencias Sociales':{count:9,label:'Laboratorio',plans:2},
'Ciencias Naturales':{count:9,label:'Laboratorio',plans:2},
'Artes':{count:6,label:'Taller',plans:2},
'Tecnologías':{count:6,label:'Taller',plans:2},
'Educación Física':{count:10,label:'Taller',plans:2}
};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readMatrix(school){try{return JSON.parse(localStorage.getItem(`pciAppV2_school_${school}`)||localStorage.getItem('pciAppV2')||'{"areas":{}}')}catch{return{areas:{}}}}
function render(){const school=$('school').value,matrix=readMatrix(school),remembered=localStorage.getItem('pciPlansOpenArea')||'';$('tree').innerHTML=Object.entries(RULES).map(([area,rule])=>{const saved=matrix.areas?.[area]?.groups||[];const groups=Array.from({length:rule.count},(_,i)=>saved[i]||{name:`${rule.label} ${i+1}`});const label=rule.label==='Nivel'?'niveles':rule.label==='Taller'?'talleres':'laboratorios';return `<details class="area" data-area-box="${esc(area)}" ${remembered===area?'open':''}><summary><span class="area-name">${esc(area)}</span><span class="area-meta">${rule.count} ${label} · ${rule.plans} planes por agrupamiento</span><span class="chevron">⌄</span></summary><div class="area-body"><div class="groups">${groups.map((g,gi)=>`<article class="group"><div class="group-title">${esc(g.name||`${rule.label} ${gi+1}`)}</div><div class="plans">${Array.from({length:rule.plans},(_,pi)=>`<button class="plan" data-area="${esc(area)}" data-group="${gi}" data-plan="${pi}">Plan ${pi+1}<small>Abrir evaluación</small></button>`).join('')}</div></article>`).join('')}</div></div></details>`}).join('');
 document.querySelectorAll('.area').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){document.querySelectorAll('.area').forEach(other=>{if(other!==d)other.open=false});localStorage.setItem('pciPlansOpenArea',d.dataset.areaBox)}else if(localStorage.getItem('pciPlansOpenArea')===d.dataset.areaBox){localStorage.removeItem('pciPlansOpenArea')}}));
 document.querySelectorAll('.plan').forEach(b=>b.onclick=()=>{const q=new URLSearchParams({school,area:b.dataset.area,group:b.dataset.group,plan:b.dataset.plan});location.href=`plan-editor.html?${q}`})}
$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=()=>{localStorage.setItem('pciActiveSchool',$('school').value);localStorage.removeItem('pciPlansOpenArea');render()};$('openAll').onclick=()=>document.querySelectorAll('.area').forEach(d=>d.open=true);$('closeAll').onclick=()=>{document.querySelectorAll('.area').forEach(d=>d.open=false);localStorage.removeItem('pciPlansOpenArea')};render();
</script></body></html>
