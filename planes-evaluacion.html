<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evaluación de planes</title><style>:root{--ink:#15374a;--mint:#83ded3;--bg:#f4f7f8;--line:#dbe5e8;--muted:#687985;--ok:#167557;--warn:#9a6500;--bad:#b52f48}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}.top strong{margin-right:auto}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer}.btn.primary{background:var(--ink);color:#fff}.btn.mint{background:var(--mint)}.btn.danger{background:#ffe9ee;color:var(--bad)}main{width:min(1350px,100%);margin:auto;padding:20px 14px 80px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.intro{color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.step{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;text-align:left;font-weight:850;cursor:pointer}.step small{display:block;color:var(--muted);font-weight:700}.step.active{background:var(--ink);color:#fff}.step.active small{color:#dfe9ec}.panel{display:none}.panel.active{display:block}.help{padding:14px;border-left:5px solid var(--mint);background:#effaf8;border-radius:12px;margin:12px 0 18px}.selectors,.weights{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:.83rem;font-weight:850;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.status{padding:12px;border-radius:12px;font-weight:900;margin:12px 0}.ok{background:#e5f6ef;color:var(--ok)}.warn{background:#fff3d8;color:var(--warn)}.stage-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.stage{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-weight:850;cursor:pointer}.stage.active{background:var(--mint)}.criterion{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.criterion-head{display:grid;grid-template-columns:1fr auto;gap:8px}.criterion-head input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:850}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.levels textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.82rem}.levels label{font-size:.78rem;font-weight:850}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.toolbar .spacer{flex:1}.student{margin:12px 0}.student-head{display:flex;gap:8px;align-items:center}.student-head input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}.matrix{overflow:auto;margin-top:10px}.matrix table,.result-table{width:100%;border-collapse:collapse;min-width:800px}.matrix th,.matrix td,.result-table th,.result-table td{border:1px solid var(--line);padding:8px;vertical-align:top}.matrix th,.result-table th{background:#edf5f6}.score{font-weight:900;text-align:center}.result-student{margin:16px 0}.result-stage{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:12px}.grade{font-size:1.1rem;font-weight:900;padding:12px;border-radius:12px;background:#edf5f6;margin-top:12px}.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:16px}@media(max-width:900px){.steps,.selectors,.weights,.levels{grid-template-columns:1fr}.top strong{width:100%}}</style></head><body><header class="top"><strong>Escuela de Maestros · Evaluación de planes</strong><button class="btn" onclick="location.href='launcher.html?v=10'">← Volver a la Matriz PCI</button><button id="save" class="btn mint">Guardar</button></header><main><section class="card"><h1>Evaluación de planes de aprendizaje</h1><p class="intro">Los agrupamientos se leen de la Matriz PCI. Este módulo no modifica la matriz original.</p><div class="steps"><button class="step active" data-step="1">Paso 1<small>Elegir plan</small></button><button class="step" data-step="2">Paso 2<small>Criterios y puntajes</small></button><button class="step" data-step="3">Paso 3<small>Evaluar estudiantes</small></button><button class="step" data-step="4">Paso 4<small>Resultados</small></button></div><div id="p1" class="panel active"></div><div id="p2" class="panel"></div><div id="p3" class="panel"></div><div id="p4" class="panel"></div></section></main><footer>Diseñado por Sebastián Giampani</footer><script>const STAGES=['PUNTO DE PARTIDA','INDAGACIÓN','PRODUCCIÓN','EVALUACIÓN'],LEVELS=['En proceso','Iniciado (6–7)','Suficiente (8–9)','Avanzado (10)'],SCORES=[0,6.5,8.5,10];const BASE={'PUNTO DE PARTIDA':[['Activación de saberes previos','No se registran saberes previos.','Menciona saberes previos de manera aislada.','Vincula saberes previos con la temática.','Revisa y fundamenta sus supuestos.'],['Formulación de hipótesis','No formula respuestas tentativas.','Formula preguntas sin respuestas propias.','Plantea hipótesis con alguna razón.','Formula hipótesis y anticipa cómo verificarlas.']],'INDAGACIÓN':[['Búsqueda y selección de información','No consulta fuentes.','Consulta fuentes sin evaluar pertinencia.','Selecciona información pertinente.','Contrasta fuentes y fundamenta elecciones.'],['Sistematización y análisis','No organiza los datos.','Enumera datos sin organización suficiente.','Organiza información principal y secundaria.','Elige y justifica la herramienta de organización.'],['Comprensión y rigurosidad','No hay análisis propio.','Reproduce definiciones.','Explica y aplica conceptos con precisión.','Relaciona conceptos, matices y límites.']],'PRODUCCIÓN':[['Producción individual','No presenta producción evaluable.','Entrega una producción parcial.','Completa la producción aplicando contenidos.','Resuelve con autonomía y fundamenta.'],['Trabajo colaborativo','No se registra participación.','Cumple una parte asignada.','Aporta ideas y sostiene su rol.','Organiza, integra aportes y resuelve desacuerdos.'],['Resolución de situaciones problema','No aborda la situación.','Aplica procedimientos con errores.','Selecciona el procedimiento adecuado.','Resuelve situaciones nuevas y justifica.']],'EVALUACIÓN':[['Contextualización y transferencia','No vincula contenidos con el entorno.','Menciona ejemplos sin explicar relación.','Vincula conocimientos con situaciones de contexto.','Reconoce alcances y límites.'],['Integración en proyectos','No utiliza lo aprendido.','Aplica parcialmente con ayuda.','Usa contenidos para resolver y fundamentar.','Integra contenidos y anticipa consecuencias.'],['Comunicación y exposición','No presenta comunicación evaluable.','Comunica de forma fragmentaria.','Expone con claridad y estructura.','Adecua la exposición y responde repreguntas.'],['Metacognición y autorregulación','No registra reflexión.','Describe lo realizado.','Identifica fortalezas y dificultades.','Analiza estrategias y formula mejoras.']]};let pci={areas:{}},db={plans:{}},step=1,stage=STAGES[0],studentStage=STAGES[0],selection={school:localStorage.getItem('pciActiveSchool')||'1',area:'',group:'0',plan:'0'};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function storageKey(){return`pciEvalV1_school_${selection.school}`}function loadSchool(){pci=JSON.parse(localStorage.getItem(`pciAppV2_school_${selection.school}`)||localStorage.getItem('pciAppV2')||'{"areas":{}}');db=JSON.parse(localStorage.getItem(storageKey())||'{"plans":{}}')}function save(){localStorage.setItem(storageKey(),JSON.stringify(db));$('save').textContent='Guardado';setTimeout(()=>$('save').textContent='Guardar',800)}function groups(){return pci.areas?.[selection.area]?.groups||[]}function planCount(){return['Lengua y Literatura','Matemática','Lenguas Adicionales'].includes(selection.area)?4:2}function pkey(){return[selection.area,selection.group,selection.plan].join('|')}function newCriteria(){return Object.fromEntries(STAGES.map(s=>[s,BASE[s].map((x,i)=>({id:`${s}-${i}`,name:x[0],levels:x.slice(1)}))]))}function ensure(){const k=pkey();if(!db.plans[k])db.plans[k]={weights:Object.fromEntries(STAGES.map(s=>[s,25])),criteria:newCriteria(),students:[]};const p=db.plans[k];p.weights=p.weights||Object.fromEntries(STAGES.map(s=>[s,25]));p.criteria=p.criteria||newCriteria();p.students=p.students||[];return p}function nav(prev,next){return`<div class="toolbar">${prev?`<button class="btn" data-go="${prev}">← Anterior</button>`:''}<span class="spacer"></span>${next?`<button class="btn primary" data-go="${next}">Guardar y continuar →</button>`:''}</div>`}function bindNav(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{save();go(+b.dataset.go)})}function go(n){step=n;document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',+b.dataset.step===n));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===`p${n}`));render()}function render1(){const areas=Object.keys(pci.areas||{});if(!areas.includes(selection.area))selection.area=areas[0]||'';const gs=groups();if(+selection.group>=gs.length)selection.group='0';const pc=planCount();if(+selection.plan>=pc)selection.plan='0';$('p1').innerHTML=`<div class="help"><b>Elegí el plan a evaluar.</b><br>Los niveles tienen 4 planes. Los talleres y laboratorios tienen 2.</div><div class="selectors"><div class="field"><label>Escuela</label><select id="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select></div><div class="field"><label>Área</label><select id="area">${areas.map(a=>`<option ${a===selection.area?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="field"><label>Agrupamiento</label><select id="group">${gs.map((g,i)=>`<option value="${i}" ${String(i)===String(selection.group)?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>Plan</label><select id="plan">${Array.from({length:pc},(_,i)=>`<option value="${i}" ${String(i)===String(selection.plan)?'selected':''}>Plan ${i+1}</option>`).join('')}</select></div></div>${nav(0,2)}`;$('school').value=selection.school;$('school').onchange=()=>{selection.school=$('school').value;localStorage.setItem('pciActiveSchool',selection.school);loadSchool();selection.area='';selection.group='0';selection.plan='0';render1()};$('area').onchange=()=>{selection.area=$('area').value;selection.group='0';selection.plan='0';render1()};$('group').onchange=()=>{selection.group=$('group').value;selection.plan='0';render1()};$('plan').onchange=()=>selection.plan=$('plan').value;bindNav()}function totalWeight(){return STAGES.reduce((a,s)=>a+(+ensure().weights[s]||0),0)}function render2(){const p=ensure();$('p2').innerHTML=`<div class="help"><b>Configurá la evaluación.</b><br>Distribuí hasta 100 puntos y editá los criterios y niveles de logro de cada etapa.</div><div class="weights">${STAGES.map(s=>`<div class="field"><label>${s}</label><input type="number" min="0" max="100" step="0.5" data-weight="${s}" value="${p.weights[s]}"></div>`).join('')}</div><div class="status ${totalWeight()===100?'ok':'warn'}">Total asignado: ${totalWeight()} / 100 · Disponible: ${Math.max(0,100-totalWeight())}</div><div class="stage-tabs">${STAGES.map(s=>`<button class="stage ${s===stage?'active':''}" data-stage="${s}">${s}</button>`).join('')}</div><h2>Criterios de ${stage}</h2>${p.criteria[stage].map((c,i)=>`<article class="criterion"><div class="criterion-head"><input data-name="${i}" value="${esc(c.name)}"><button class="btn danger" data-remove="${i}">Eliminar</button></div><div class="levels">${LEVELS.map((l,j)=>`<div><label>${l}</label><textarea data-level="${i}|${j}">${esc(c.levels[j]||'')}</textarea></div>`).join('')}</div></article>`).join('')}<button id="addCriterion" class="btn mint">Agregar criterio</button>${nav(1,3)}`;document.querySelectorAll('[data-weight]').forEach(e=>e.onchange=()=>{const old=p.weights[e.dataset.weight];p.weights[e.dataset.weight]=+e.value||0;if(totalWeight()>100){p.weights[e.dataset.weight]=old;alert('La suma no puede superar 100.')}save();render2()});document.querySelectorAll('[data-stage]').forEach(e=>e.onclick=()=>{stage=e.dataset.stage;render2()});document.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{p.criteria[stage][+e.dataset.name].name=e.value;save()});document.querySelectorAll('[data-level]').forEach(e=>e.oninput=()=>{const[i,j]=e.dataset.level.split('|').map(Number);p.criteria[stage][i].levels[j]=e.value;save()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{p.criteria[stage].splice(+e.dataset.remove,1);save();render2()});$('addCriterion').onclick=()=>{p.criteria[stage].push({id:'c'+Date.now(),name:'Nuevo criterio',levels:['','','','']});save();render2()};bindNav()}function ensureStudent(s){s.scores=s.scores||{};s.enabled=s.enabled||{};STAGES.forEach(st=>{s.scores[st]=s.scores[st]||{};s.enabled[st]=s.enabled[st]||{}})}function enabledCriteria(s,st){ensureStudent(s);return ensure().criteria[st].filter(c=>s.enabled[st][c.id]!==false)}function criterionScore(s,st,c){ensureStudent(s);return typeof s.scores[st][c.id]==='number'?s.scores[st][c.id]:0}function stageScore(s,st){const cs=enabledCriteria(s,st);if(!cs.length)return 0;const sum=cs.reduce((a,c)=>a+criterionScore(s,st,c),0);return(sum/cs.length)*(+ensure().weights[st]||0)/10}function totalScore(s){return STAGES.reduce((a,st)=>a+stageScore(s,st),0)}function render3(){const p=ensure();$('p3').innerHTML=`<div class="help"><b>Evaluá a cada estudiante.</b><br>Los criterios sin evaluar cuentan como 0. Podés desactivar un criterio si no corresponde a ese estudiante.</div><div class="stage-tabs">${STAGES.map(s=>`<button class="stage ${s===studentStage?'active':''}" data-student-stage="${s}">${s}</button>`).join('')}</div><div class="status ok">Evaluando: ${studentStage} · máximo ${p.weights[studentStage]} puntos</div><button id="addStudent" class="btn primary">Agregar estudiante</button>${p.students.length?p.students.map((s,i)=>studentHTML(s,i)).join(''):'<div class="empty" style="margin-top:12px">Todavía no hay estudiantes cargados.</div>'}${nav(2,4)}`;document.querySelectorAll('[data-student-stage]').forEach(e=>e.onclick=()=>{studentStage=e.dataset.studentStage;render3()});$('addStudent').onclick=()=>{p.students.push({name:'',scores:{},enabled:{}});save();render3()};document.querySelectorAll('[data-student-name]').forEach(e=>e.oninput=()=>{p.students[+e.dataset.studentName].name=e.value;save()});document.querySelectorAll('[data-remove-student]').forEach(e=>e.onclick=()=>{p.students.splice(+e.dataset.removeStudent,1);save();render3()});document.querySelectorAll('[data-enable]').forEach(e=>e.onchange=()=>{const[i,id]=e.dataset.enable.split('|'),s=p.students[+i];ensureStudent(s);s.enabled[studentStage][id]=e.checked;if(!e.checked)delete s.scores[studentStage][id];save();render3()});document.querySelectorAll('[data-score]').forEach(e=>e.onchange=()=>{const[i,id]=e.dataset.score.split('|'),s=p.students[+i];ensureStudent(s);if(e.value==='')delete s.scores[studentStage][id];else s.scores[studentStage][id]=+e.value;save();render3()});bindNav()}function studentHTML(s,i){ensureStudent(s);const p=ensure();return`<article class="student card"><div class="student-head"><input data-student-name="${i}" value="${esc(s.name||'')}" placeholder="Nombre del estudiante"><button class="btn danger" data-remove-student="${i}">Eliminar</button></div><div class="matrix"><table><thead><tr><th>Usar</th><th>Criterio</th><th>Nivel de logro</th><th>Puntaje base</th></tr></thead><tbody>${p.criteria[studentStage].map(c=>{const enabled=s.enabled[studentStage][c.id]!==false,v=s.scores[studentStage][c.id];return`<tr><td><input type="checkbox" data-enable="${i}|${c.id}" ${enabled?'checked':''}></td><td>${esc(c.name)}</td><td><select data-score="${i}|${c.id}" ${enabled?'':'disabled'}><option value="">Sin evaluar</option>${LEVELS.map((l,j)=>`<option value="${SCORES[j]}" ${v===SCORES[j]?'selected':''}>${l}</option>`).join('')}</select></td><td class="score">${typeof v==='number'?v:'0'}</td></tr>`}).join('')}<tr><td colspan="3"><b>Subtotal de la etapa</b></td><td class="score">${stageScore(s,studentStage).toFixed(2)} / ${p.weights[studentStage]}</td></tr></tbody></table></div></article>`}function finalGrade(total){if(total<60)return'En proceso';return`Finalizado · ${Math.round(total/10)}`}function render4(){const p=ensure();$('p4').innerHTML=`<div class="help"><b>Resultados detallados.</b><br>Cada etapa muestra el puntaje de sus criterios y el total obtenido. La calificación final se calcula sobre 100.</div>${p.students.length?p.students.map(s=>resultHTML(s)).join(''):'<div class="empty">Todavía no hay estudiantes evaluados.</div>'}${nav(3,0)}`;bindNav()}function resultHTML(s){ensureStudent(s);const total=totalScore(s);return`<article class="result-student card"><h2>${esc(s.name||'Sin nombre')}</h2>${STAGES.map(st=>`<section class="result-stage"><h3>${st} · máximo ${ensure().weights[st]}</h3><div class="matrix"><table class="result-table"><thead><tr><th>Criterio</th><th>Puntaje</th></tr></thead><tbody>${enabledCriteria(s,st).map(c=>`<tr><td>${esc(c.name)}</td><td class="score">${criterionScore(s,st,c)}</td></tr>`).join('')}<tr><td><b>Total de la etapa</b></td><td class="score"><b>${stageScore(s,st).toFixed(2)} / ${ensure().weights[st]}</b></td></tr></tbody></table></div></section>`).join('')}<div class="grade">Total: ${total.toFixed(2)} / ${totalWeight()} · Calificación: ${finalGrade(total)}</div></article>`}function render(){if(step===1)render1();else if(step===2)render2();else if(step===3)render3();else render4()}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));$('save').onclick=save;loadSchool();render();</script></body></html>
