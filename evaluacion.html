<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evaluación</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7f8;color:#15374a}header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #dbe5e8}header strong{margin-right:auto}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:#e7edef;color:#15374a;cursor:pointer}.mint{background:#83ded3}main{max-width:1100px;margin:auto;padding:18px 14px}.card{background:#fff;border:1px solid #dbe5e8;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:180px 1fr 1fr auto;gap:8px}select,input{width:100%;padding:10px;border:1px solid #dbe5e8;border-radius:10px}.stage{border-top:1px solid #dbe5e8;padding-top:12px;margin-top:12px}.criterion{display:grid;grid-template-columns:1fr 220px;gap:8px;align-items:center;margin:8px 0}.total{font-weight:900;background:#edf5f6;padding:10px;border-radius:10px}.empty,.error{padding:22px;text-align:center;border-radius:14px;background:#fff;border:1px dashed #dbe5e8;color:#687985}.error{color:#a1283f;border-color:#e9b7c1;background:#fff7f8}@media(max-width:760px){.grid,.criterion{grid-template-columns:1fr}}</style></head><body><header><button class="btn" onclick="location.href='planes-arbol.html?v=5'">← Planes</button><strong>Evaluación</strong><button id="save" class="btn mint">Guardar</button></header><main><section class="card"><div class="grid"><select id="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select><select id="plan"></select><input id="student" placeholder="Nombre del estudiante"><button id="add" class="btn mint">Agregar estudiante</button></div></section><div id="students"></div></main><script>
(function(){
var ST=['Punto de partida','Indagación','Producción','Evaluación'],LV=['En proceso','Iniciado','Suficiente','Avanzado'],SC=[0,6.5,8.5,10];
function $(x){return document.getElementById(x)}function read(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function safePlans(x){return x&&x.plans&&typeof x.plans==='object'?x:{plans:{}}}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var design={plans:{}},evaldb={plans:{}};
function normalizePlan(p){p=p||{};p.weights=p.weights||{};p.criteria=p.criteria||{};ST.forEach(function(s){if(!Array.isArray(p.criteria[s]))p.criteria[s]=[]});return p}
function load(){try{var s=$('school').value;design=safePlans(read('pciPlanDesignV1_school_'+s,{plans:{}}));evaldb=safePlans(read('pciAssessmentV1_school_'+s,{plans:{}}));var entries=Object.keys(design.plans);$('plan').innerHTML=entries.length?entries.map(function(k){var p=normalizePlan(design.plans[k]);return '<option value="'+esc(k)+'">'+esc(k.split('|').join(' · '))+' · '+esc(p.name||'Plan')+'</option>'}).join(''):'<option value="">No hay planes diseñados</option>';render()}catch(e){showError(e)}}
function save(){try{localStorage.setItem('pciAssessmentV1_school_'+$('school').value,JSON.stringify(evaldb));$('save').textContent='Guardado';setTimeout(function(){$('save').textContent='Guardar'},700)}catch(e){showError(e)}}
function current(){var k=$('plan').value;if(!k)return null;if(!evaldb.plans[k]||typeof evaldb.plans[k]!=='object')evaldb.plans[k]={students:[]};if(!Array.isArray(evaldb.plans[k].students))evaldb.plans[k].students=[];return evaldb.plans[k]}
function score(st,p,s){var cs=p.criteria[s]||[];if(!cs.length)return 0;var sum=0;for(var i=0;i<cs.length;i++)sum+=Number(st.scores&&st.scores[s]&&st.scores[s][i]!==undefined?st.scores[s][i]:0);return sum/cs.length*Number(p.weights[s]||0)/10}
function total(st,p){var n=0;ST.forEach(function(s){n+=score(st,p,s)});return n}
function render(){try{var k=$('plan').value,p=k?normalizePlan(design.plans[k]):null,e=current();if(!p||!e){$('students').innerHTML='<div class="empty">Primero diseñá y guardá un plan en el Constructor de Planes.</div>';return}var html='';e.students.forEach(function(st,si){st=st||{name:'',scores:{}};st.scores=st.scores||{};html+='<article class="card"><input data-name="'+si+'" value="'+esc(st.name||'')+'">';ST.forEach(function(s){html+='<section class="stage"><h3>'+esc(s)+' · máximo '+Number(p.weights[s]||0)+'</h3>';(p.criteria[s]||[]).forEach(function(c,ci){var val=st.scores[s]&&st.scores[s][ci]!==undefined?st.scores[s][ci]:'';html+='<div class="criterion"><b>'+esc(c&&c.name||('Criterio '+(ci+1)))+'</b><select data-score="'+si+'|'+s+'|'+ci+'"><option value="">Sin evaluar</option>';LV.forEach(function(l,j){html+='<option value="'+SC[j]+'" '+(String(val)===String(SC[j])?'selected':'')+'>'+l+'</option>'});html+='</select></div>'});html+='<div class="total">Subtotal: '+score(st,p,s).toFixed(2)+' / '+Number(p.weights[s]||0)+'</div></section>'});var t=total(st,p);html+='<div class="total">Total: '+t.toFixed(2)+' / 100 · '+(t<60?'En proceso':'Finalizado · '+Math.round(t/10))+'</div></article>'});$('students').innerHTML=html||'<div class="empty">Agregá estudiantes para comenzar.</div>';bind()}catch(e){showError(e)}}
function bind(){var names=document.querySelectorAll('[data-name]');for(var i=0;i<names.length;i++)names[i].oninput=function(){current().students[Number(this.getAttribute('data-name'))].name=this.value;save()};var scores=document.querySelectorAll('[data-score]');for(var j=0;j<scores.length;j++)scores[j].onchange=function(){var a=this.getAttribute('data-score').split('|'),st=current().students[Number(a[0])];st.scores=st.scores||{};st.scores[a[1]]=st.scores[a[1]]||{};if(this.value==='')delete st.scores[a[1]][a[2]];else st.scores[a[1]][a[2]]=Number(this.value);save();render()}}
function showError(e){$('students').innerHTML='<div class="error"><b>No se pudo cargar la evaluación.</b><br>Volvé al Constructor, guardá un plan y regresá a esta pantalla.<br><small>'+esc(e&&e.message||'Error de datos')+'</small></div>'}
$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=load;$('plan').onchange=render;$('add').onclick=function(){var n=$('student').value.trim(),c=current();if(!c){$('students').innerHTML='<div class="empty">No hay un plan diseñado para evaluar.</div>';return}if(!n)return;c.students.push({name:n,scores:{}});$('student').value='';save();render()};$('save').onclick=save;load();
})();
</script></body></html>
