<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evaluación</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7f8;color:#15374a}header{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #dbe5e8}header strong{margin-right:auto}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:#e7edef;color:#15374a}.mint{background:#83ded3}main{max-width:1100px;margin:auto;padding:18px 14px}.card{background:#fff;border:1px solid #dbe5e8;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}select,input{width:100%;padding:10px;border:1px solid #dbe5e8;border-radius:10px}.stage{border-top:1px solid #dbe5e8;padding-top:12px;margin-top:12px}.criterion{display:grid;grid-template-columns:1fr 220px;gap:8px;align-items:center;margin:8px 0}.total{font-weight:900;background:#edf5f6;padding:10px;border-radius:10px}.empty{padding:20px;text-align:center;color:#687985}@media(max-width:760px){.grid,.criterion{grid-template-columns:1fr}}</style></head><body><header><button class="btn" onclick="location.href='planes-arbol.html'">← Planes</button><strong>Evaluación</strong><button id="save" class="btn mint">Guardar</button></header><main><section class="card"><div class="grid"><select id="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select><select id="plan"></select><input id="student" placeholder="Nombre del estudiante"><button id="add" class="btn mint">Agregar estudiante</button></div></section><div id="students"></div></main><script>const ST=['Punto de partida','Indagación','Producción','Evaluación'],LV=['En proceso','Iniciado','Suficiente','Avanzado'],SC=[0,6.5,8.5,10],$=x=>document.getElementById(x);let design={},evaldb={plans:{}};function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function load(){const s=$('school').value;design=read(`pciPlanDesignV1_school_${s}`,{plans:{}});evaldb=read(`pciAssessmentV1_school_${s}`,{plans:{}});$('plan').innerHTML=Object.entries(design.plans).map(([k,p])=>`<option value="${k}">${k.replaceAll('|',' · ')} · ${p.name}</option>`).join('');render()}function save(){localStorage.setItem(`pciAssessmentV1_school_${$('school').value}`,JSON.stringify(evaldb));$('save').textContent='Guardado';setTimeout(()=>$('save').textContent='Guardar',700)}function current(){const k=$('plan').value;if(!k)return null;evaldb.plans[k]??={students:[]};return evaldb.plans[k]}function scoreStudent(st,p,stage){const cs=p.criteria?.[stage]||[];if(!cs.length)return 0;const sum=cs.reduce((a,c,i)=>a+(st.scores?.[stage]?.[i]??0),0);return sum/cs.length*(+p.weights?.[stage]||0)/10}function total(st,p){return ST.reduce((a,s)=>a+scoreStudent(st,p,s),0)}function render(){const k=$('plan').value,p=design.plans?.[k],e=current();if(!p||!e){$('students').innerHTML='<div class="empty">Primero diseñá un plan.</div>';return}$('students').innerHTML=e.students.map((st,si)=>`<article class="card"><input data-name="${si}" value="${st.name}">${ST.map(s=>`<section class="stage"><h3>${s} · máximo ${p.weights[s]||0}</h3>${(p.criteria[s]||[]).map((c,ci)=>`<div class="criterion"><b>${c.name}</b><select data-score="${si}|${s}|${ci}"><option value="">Sin evaluar</option>${LV.map((l,j)=>`<option value="${SC[j]}" ${(st.scores?.[s]?.[ci]??'')===SC[j]?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}<div class="total">Subtotal: ${scoreStudent(st,p,s).toFixed(2)} / ${p.weights[s]||0}</div></section>`).join('')}<div class="total">Total: ${total(st,p).toFixed(2)} / 100 · ${total(st,p)<60?'En proceso':'Finalizado · '+Math.round(total(st,p)/10)}</div></article>`).join('')||'<div class="empty">Agregá estudiantes para comenzar.</div>';document.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{current().students[+e.dataset.name].name=e.value;save()});document.querySelectorAll('[data-score]').forEach(e=>e.onchange=()=>{const[i,s,c]=e.dataset.score.split('|'),st=current().students[+i];st.scores??={};st.scores[s]??={};if(e.value==='')delete st.scores[s][c];else st.scores[s][c]=+e.value;save();render()})}$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=load;$('plan').onchange=render;$('add').onclick=()=>{const n=$('student').value.trim();if(!n||!current())return;current().students.push({name:n,scores:{}});$('student').value='';save();render()};$('save').onclick=save;load();</script></body></html>
