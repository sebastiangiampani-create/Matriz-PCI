<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Asesor de Diseño Curricular</title><style>:root{--ink:#15374a;--mint:#83ded3;--bg:#eef3f4;--line:#d7e2e5}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}header strong{margin-right:auto}.btn{border:0;border-radius:12px;padding:9px 12px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer}.btn.active{background:var(--ink);color:#fff}.note{padding:10px 12px;background:#eaf9f7;border-bottom:1px solid #c9ebe6;font-weight:750;font-size:.9rem}.frame-wrap{height:calc(100vh - 101px)}iframe{width:100%;height:100%;border:0;background:#fff}</style></head><body><header><strong>Prueba · Asesor de Diseño Curricular</strong><button id="matrixBtn" class="btn active">Matriz original</button><button id="constructorBtn" class="btn">Mapa vivo</button><button id="dashboardBtn" class="btn">Tablero</button></header><div id="note" class="note">La Matriz original se conserva completa para crear espacios, entrar a cada agrupamiento y asignar o mover contenidos.</div><div class="frame-wrap"><iframe id="view" src="app.html?v=matriz-preservada-1"></iframe></div><script>const view=document.getElementById('view'),note=document.getElementById('note');const buttons=[...document.querySelectorAll('.btn')];function openView(file,button,text){view.src=file;buttons.forEach(b=>b.classList.remove('active'));button.classList.add('active');note.textContent=text}matrixBtn.onclick=()=>openView('app.html?v=matriz-preservada-1',matrixBtn,'La Matriz original se conserva completa para crear espacios, entrar a cada agrupamiento y asignar o mover contenidos.');constructorBtn.onclick=()=>openView('constructor-curricular.html?v=1',constructorBtn,'El Mapa vivo usa la misma información guardada por la Matriz y permite reorganizar los espacios entre C1 y C10.');dashboardBtn.onclick=()=>openView('asesor-curricular.html?v=1',dashboardBtn,'El Tablero calcula cobertura de contenidos, horas y alertas sobre la propuesta guardada.');</script></body></html>
