<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escuela 4 · Matriz PCI</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f8;color:#15374a}body{display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:10px;min-height:68px;padding:9px 12px;background:#fff;border-bottom:1px solid #dbe5e8;flex-wrap:wrap}.logo{width:170px}.title{font-weight:900;margin-right:auto}.status{font-size:.82rem;font-weight:800;color:#687985}.status.ok{color:#167557}.status.bad{color:#b52f48}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:#e7edef;color:#15374a;cursor:pointer;text-decoration:none}.btn.primary{background:#15374a;color:#fff}.frame{width:100%;flex:1;border:0}.gate{position:fixed;inset:0;z-index:100;background:#f4f7f8;display:grid;place-items:center;padding:18px}.gate.hidden{display:none}.card{width:min(560px,100%);background:#fff;border:1px solid #dbe5e8;border-radius:24px;padding:26px;box-shadow:0 20px 55px #15374a20}.card img{width:min(330px,80vw)}.code{margin:16px 0;padding:13px;background:#eaf9f7;border:1px solid #c9ebe6;border-radius:14px;text-align:center;font-weight:900;letter-spacing:.06em}.note{font-size:.86rem;color:#687985}@media(max-width:700px){.logo{width:145px}.top .btn{flex:1;text-align:center}.status{width:100%}}</style></head><body><header class="top"><img class="logo" src="logo-oficial-v2.svg?rev=20260803-1" alt="Escuela de Maestros"><div class="title">Matriz PCI · Escuela 4</div><span id="status" class="status"></span><a class="btn" href="plataforma.html">← Menú principal</a><button id="reload" class="btn">Recargar modelo</button><button id="save" class="btn primary">Guardar online</button></header><iframe id="app" class="frame" title="Matriz PCI Escuela 4"></iframe><section id="gate" class="gate"><div class="card"><img src="logo-oficial-v2.svg?rev=20260803-1" alt="Escuela de Maestros"><h1>Escuela 4</h1><p>Modelo de prueba con los laboratorios de Ciencias Naturales y Ciencias Sociales.</p><div class="code">Código: PCI-404</div><button id="enter" class="btn primary">Ingresar a Escuela 4</button><p class="note">Los cambios se guardan online y pueden verse desde cualquier computadora.</p></div></section><script>
const SUPA_URL='https://agmebsotbuurbnldxewf.supabase.co',SUPA_KEY='sb_publishable_L74-lwkMH_4vsTXHCEQ7tw_fYQui0WT';
const H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
const frame=document.getElementById('app'),gate=document.getElementById('gate'),status=document.getElementById('status');let timer=null,last='';
function setStatus(t,c=''){status.textContent=t;status.className='status '+c}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function words(s){return new Set(norm(s).split(' ').filter(x=>x.length>3))}
function overlap(a,b){const A=words(a),B=words(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>{if(B.has(x))n++});return n/Math.min(A.size,B.size)}
async function row(){const r=await fetch(`${SUPA_URL}/rest/v1/pci_proposals?school_id=eq.4&select=school_id,data,edit_code`,{headers:H});if(!r.ok)throw Error(await r.text());const j=await r.json();if(!j.length)throw Error('Escuela 4 no existe');return j[0]}
async function patch(data){const r=await fetch(`${SUPA_URL}/rest/v1/pci_proposals?school_id=eq.4`,{method:'PATCH',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify({data,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(await r.text())}
async function waitApp(){for(let i=0;i<100;i++){await new Promise(r=>setTimeout(r,140));try{const D=frame.contentWindow.eval('DATA');if(Array.isArray(D)&&D.length)return D}catch{}}throw Error('La base curricular no terminó de cargar')}
async function seedState(){const seed=await fetch('data/school4-seed.json?v=3').then(r=>r.json());frame.src='app.html?v=school4-seed-3';const D=await waitApp();const state={areas:{},current:null};for(const area of ['Ciencias Naturales','Ciencias Sociales']){const labs=seed.labs.filter(l=>l.area===area);state.areas[area]={closed:false,groups:labs.map(l=>{const joined=l.content_blocks.join(' '),items=D.filter(x=>x.area===area).filter(x=>{const nx=norm(x.text);return nx.length>18&&(norm(joined).includes(nx)||overlap(joined,x.text)>=.82)}).map(x=>x.id);return{name:l.name,objective:'A definir por la institución',context:l.context,type:l.type,term:String(l.term),custom:false,elective:l.type==='Electivo',items,sourceContent:l.content_blocks}})}}return state}
async function load(force=false){setStatus('Cargando…');const r=await row();let data=r.data&&typeof r.data==='object'?r.data:{areas:{},current:null};const empty=!data.areas||Object.keys(data.areas).length===0;if(force||empty){data=await seedState();await patch(data)}const raw=JSON.stringify(data);localStorage.setItem('pciAppV2',raw);last=raw;frame.src='app.html?v=school4-cloud-3';setStatus('Conectado','ok');start()}
function start(){clearInterval(timer);timer=setInterval(async()=>{const raw=localStorage.getItem('pciAppV2')||'';if(!raw||raw===last)return;setStatus('Guardando…');try{await patch(JSON.parse(raw));last=raw;setStatus('Guardado online','ok')}catch(e){console.error(e);setStatus('Error al guardar','bad')}},1200)}
async function enter(){try{const r=await row();const code=prompt('Código de edición para Escuela 4:');if(code===null)return;if(code.trim()!==String(r.edit_code).trim()){alert('Código incorrecto.');return}gate.classList.add('hidden');await load(false)}catch(e){console.error(e);alert('No se pudo abrir Escuela 4. Revisá Supabase y volvé a intentar.');setStatus('Sin conexión','bad')}}
document.getElementById('enter').onclick=enter;document.getElementById('reload').onclick=()=>{if(confirm('¿Recargar el modelo original? Se reemplazarán los cambios guardados de Escuela 4.'))load(true)};document.getElementById('save').onclick=async()=>{try{const raw=localStorage.getItem('pciAppV2');if(raw){await patch(JSON.parse(raw));last=raw}setStatus('Guardado online','ok')}catch(e){setStatus('Error al guardar','bad')}};
</script></body></html>
