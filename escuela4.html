<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escuela 4 · Matriz PCI</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f8;color:#15374a}body{display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:10px;min-height:68px;padding:9px 12px;background:#fff;border-bottom:1px solid #dbe5e8;flex-wrap:wrap}.logo{width:170px}.title{font-weight:900;margin-right:auto}.status{font-size:.82rem;font-weight:800;color:#687985}.status.ok{color:#167557}.status.bad{color:#b52f48}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;background:#e7edef;color:#15374a;cursor:pointer;text-decoration:none}.btn.primary{background:#15374a;color:#fff}.btn.mint{background:#83ded3}.frame{width:100%;flex:1;border:0}.gate{position:fixed;inset:0;z-index:100;background:#f4f7f8;display:grid;place-items:center;padding:18px}.gate.hidden{display:none}.card{width:min(560px,100%);background:#fff;border:1px solid #dbe5e8;border-radius:24px;padding:26px;box-shadow:0 20px 55px #15374a20}.card img{width:min(330px,80vw)}.code{margin:16px 0;padding:13px;background:#eaf9f7;border:1px solid #c9ebe6;border-radius:14px;text-align:center;font-weight:900;letter-spacing:.06em}.note{font-size:.86rem;color:#687985}@media(max-width:700px){.logo{width:145px}.top .btn{flex:1;text-align:center}.status{width:100%}}</style></head><body><header class="top"><img class="logo" src="logo-oficial-v2.svg?rev=20260803-1" alt="Escuela de Maestros"><div class="title">Matriz PCI · Escuela 4</div><span id="status" class="status"></span><a class="btn" href="plataforma.html">← Menú principal</a><a class="btn primary" href="trayectoria-pci.html?v=complete-2">Mapa completo</a><button id="control" class="btn mint">Tabla de control</button><button id="printProgress" class="btn">Imprimir avance</button><button id="reload" class="btn">Recargar modelo</button><button id="save" class="btn primary">Guardar online</button></header><iframe id="app" class="frame" title="Matriz PCI Escuela 4"></iframe><section id="gate" class="gate"><div class="card"><img src="logo-oficial-v2.svg?rev=20260803-1" alt="Escuela de Maestros"><h1>Escuela 4</h1><p>Modelo de prueba con los laboratorios de Ciencias Naturales y Ciencias Sociales.</p><div class="code">Código: PCI-404</div><button id="enter" class="btn primary">Ingresar a Escuela 4</button><p class="note">Los cambios se guardan online y pueden verse desde cualquier computadora.</p></div></section><script>
const SUPA_URL='https://agmebsotbuurbnldxewf.supabase.co',SUPA_KEY='sb_publishable_L74-lwkMH_4vsTXHCEQ7tw_fYQui0WT';
const H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
const frame=document.getElementById('app'),gate=document.getElementById('gate'),status=document.getElementById('status');let timer=null,last='';
function setStatus(t,c=''){status.textContent=t;status.className='status '+c}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function words(s){return new Set(norm(s).split(' ').filter(x=>x.length>3))}
function overlap(a,b){const A=words(a),B=words(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>{if(B.has(x))n++});return n/Math.min(A.size,B.size)}
async function row(){const r=await fetch(`${SUPA_URL}/rest/v1/pci_proposals?school_id=eq.4&select=school_id,data,edit_code`,{headers:H});if(!r.ok)throw Error(await r.text());const j=await r.json();if(!j.length)throw Error('Escuela 4 no existe');return j[0]}
async function patch(data){const r=await fetch(`${SUPA_URL}/rest/v1/pci_proposals?school_id=eq.4`,{method:'PATCH',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify({data,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(await r.text())}
async function waitApp(){for(let i=0;i<100;i++){await new Promise(r=>setTimeout(r,140));try{const D=frame.contentWindow.eval('DATA');if(Array.isArray(D)&&D.length)return D}catch{}}throw Error('La base curricular no terminó de cargar')}
async function seedState(){const seed=await fetch('data/school4-seed.json?v=3').then(r=>r.json());frame.src='app.html?v=school4-seed-3';const D=await waitApp();const state={areas:{},current:null};for(const area of ['Ciencias Naturales','Ciencias Sociales']){const labs=seed.labs.filter(l=>l.area===area);state.areas[area]={closed:false,groups:labs.map(l=>{const joined=l.content_blocks.join(' '),items=D.filter(x=>x.area===area).filter(x=>{const nx=norm(x.text);return nx.length>18&&(norm(joined).includes(nx)||overlap(joined,x.text)>=.82)}).map(x=>x.id);return{name:l.name,objective:'A definir por la institución',context:l.context,type:l.type,term:String(l.term),custom:false,elective:l.type==='Electivo',items,sourceContent:l.content_blocks}})}}return state}
async function load(force=false){setStatus('Cargando…');const r=await row();let data=r.data&&typeof r.data==='object'?r.data:{areas:{},current:null};const empty=!data.areas||Object.keys(data.areas).length===0;if(force||empty){data=await seedState();await patch(data)}const raw=JSON.stringify(data);localStorage.setItem('pciAppV2',raw);last=raw;frame.src='app.html?v=school4-cloud-4';setStatus('Conectado','ok');start()}
function start(){clearInterval(timer);timer=setInterval(async()=>{const raw=localStorage.getItem('pciAppV2')||'';if(!raw||raw===last)return;setStatus('Guardando…');try{await patch(JSON.parse(raw));last=raw;setStatus('Guardado online','ok')}catch(e){console.error(e);setStatus('Error al guardar','bad')}},1200)}
function state(){try{return{DATA:frame.contentWindow.eval('DATA'),app:frame.contentWindow.eval('app')}}catch{return null}}
function reportRows(){const S=state();if(!S||!Array.isArray(S.DATA)||!S.DATA.length){alert('Esperá a que termine de cargar la base.');return null}const rows=[];for(const area of ['Ciencias Naturales','Ciencias Sociales']){const d=S.app.areas?.[area],all=S.DATA.filter(x=>x.area===area);for(const x of all){const groups=d?d.groups.filter(g=>(g.items||[]).includes(x.id)).map(g=>g.name):[];rows.push({area,subject:x.subject,axis:x.axis,text:x.text,groups:groups.length?groups.join(' · '):'Pendiente'})}}return{...S,rows}}
function styles(){return `body{font-family:Arial,sans-serif;color:#15374a;margin:22px}h1{margin-bottom:4px}h2{border-bottom:2px solid #83ded3;padding-bottom:5px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #b9c7cc;padding:5px;text-align:left;vertical-align:top}th{background:#edf5f6}.pending{color:#9a6500;font-weight:bold}.tools{position:sticky;top:0;background:#fff;padding:10px 0;display:flex;justify-content:flex-end;gap:8px}.tools button{border:0;border-radius:10px;padding:10px 14px;background:#15374a;color:#fff;font-weight:bold}.summary{display:flex;gap:18px;flex-wrap:wrap;background:#edf5f6;padding:12px;border-radius:10px;margin:12px 0 18px}.group{border:1px solid #cdd9dd;border-radius:12px;padding:14px;margin:12px 0;break-inside:avoid}.credit{text-align:center;color:#687985;margin-top:28px}@media print{.tools{display:none}body{margin:8mm}}`}
function openControl(){const R=reportRows();if(!R)return;const assigned=R.rows.filter(r=>r.groups!=='Pendiente').length,w=window.open('','_blank');if(!w){alert('Habilitá ventanas emergentes.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Tabla de control · Escuela 4</title><style>${styles()}</style></head><body><div class="tools"><button onclick="print()">Imprimir / Guardar PDF</button></div><h1>Tabla de control · Escuela 4</h1><div class="summary"><b>${assigned} asignados</b><b>${R.rows.length-assigned} pendientes</b><b>${R.rows.length} totales</b></div><table><thead><tr><th>Área</th><th>Materia</th><th>Eje/Bloque</th><th>Contenido priorizado</th><th>Laboratorio</th></tr></thead><tbody>${R.rows.map(r=>`<tr><td>${esc(r.area)}</td><td>${esc(r.subject)}</td><td>${esc(r.axis||'')}</td><td>${esc(r.text)}</td><td class="${r.groups==='Pendiente'?'pending':''}">${esc(r.groups)}</td></tr>`).join('')}</tbody></table><p class="credit">Diseñado por Sebastián Giampani</p></body></html>`);w.document.close();w.focus()}
function printAdvance(){const S=state();if(!S){alert('Esperá a que termine de cargar la base.');return}const areas=['Ciencias Naturales','Ciencias Sociales'].map(area=>{const d=S.app.areas?.[area];if(!d)return'';return `<h2>${esc(area)}</h2>${d.groups.map(g=>`<section class="group"><h3>${esc(g.name)}</h3><p><b>Tipo:</b> ${esc(g.type||'Pendiente')}</p><p><b>Cuatrimestre:</b> ${esc(g.term||'Pendiente')}</p><p><b>Objetivos:</b> ${esc(g.objective||'Pendiente')}</p><p><b>Contexto:</b> ${esc(g.context||'Pendiente')}</p><h4>Contenidos</h4><ul>${(g.items||[]).map(id=>{const x=S.DATA.find(y=>y.id===id);return x?`<li>${esc(x.text)}</li>`:''}).join('')||'<li>Sin contenidos asignados</li>'}</ul></section>`).join('')}`}).join('');const w=window.open('','_blank');if(!w){alert('Habilitá ventanas emergentes.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Informe de avance · Escuela 4</title><style>${styles()}</style></head><body><div class="tools"><button onclick="print()">Imprimir / Guardar PDF</button></div><h1>Informe de avance · Escuela 4</h1>${areas}<p class="credit">Diseñado por Sebastián Giampani</p></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),500)}
async function enter(){try{const r=await row();const code=prompt('Código de edición para Escuela 4:');if(code===null)return;if(code.trim()!==String(r.edit_code).trim()){alert('Código incorrecto.');return}gate.classList.add('hidden');await load(false)}catch(e){console.error(e);alert('No se pudo abrir Escuela 4. Revisá Supabase y volvé a intentar.');setStatus('Sin conexión','bad')}}
document.getElementById('enter').onclick=enter;document.getElementById('control').onclick=openControl;document.getElementById('printProgress').onclick=printAdvance;document.getElementById('reload').onclick=()=>{if(confirm('¿Recargar el modelo original? Se reemplazarán los cambios guardados de Escuela 4.'))load(true)};document.getElementById('save').onclick=async()=>{try{const raw=localStorage.getItem('pciAppV2');if(raw){await patch(JSON.parse(raw));last=raw}setStatus('Guardado online','ok')}catch(e){setStatus('Error al guardar','bad')}};
</script></body></html>
