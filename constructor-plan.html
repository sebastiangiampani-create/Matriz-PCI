<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constructor de Planes</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7f8;color:#15374a}header{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #dbe5e8}header strong{margin-right:auto}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:#e7edef;color:#15374a}.mint{background:#83ded3}main{max-width:1100px;margin:auto;padding:18px 14px}.card{background:#fff;border:1px solid #dbe5e8;border-radius:18px;padding:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{border:1px solid #dbe5e8;border-radius:999px;padding:9px 12px;background:#fff;font-weight:800}.tab.on{background:#15374a;color:#fff}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:.82rem;font-weight:800;margin-bottom:4px}input,textarea{width:100%;padding:10px;border:1px solid #dbe5e8;border-radius:10px}textarea{min-height:90px}.row{margin:10px 0}.stage{border:1px solid #dbe5e8;border-radius:14px;padding:12px;margin:10px 0}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.levels textarea{min-height:90px;font-size:.8rem}.weights{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.status{padding:10px;border-radius:10px;background:#fff3d8;color:#9a6500;font-weight:800;margin:10px 0}.ok{background:#e5f6ef;color:#167557}@media(max-width:800px){.grid,.weights,.levels{grid-template-columns:1fr}}</style></head><body><header><button class="btn" onclick="history.back()">← Árbol</button><strong id="ctx">Constructor de Plan</strong><button id="save" class="btn mint">Guardar</button></header><main><section class="card"><h1 id="title">Plan</h1><div class="tabs"><button class="tab on" data-p="info">Información</button><button class="tab" data-p="content">Contenidos y objetivos</button><button class="tab" data-p="rubric">Rúbrica</button></div><div id="info" class="panel on"></div><div id="content" class="panel"></div><div id="rubric" class="panel"></div></section></main><script>const S=['Punto de partida','Indagación','Producción','Evaluación'],L=['En proceso','Iniciado','Suficiente','Avanzado'];const q=new URLSearchParams(location.search),school=q.get('school')||'1',area=q.get('area')||'',group=+(q.get('group')||0),plan=+(q.get('plan')||0),$=x=>document.getElementById(x);let matrix=read(`pciAppV2_school_${school}`,read('pciAppV2',{areas:{}})),db=read(`pciPlanDesignV1_school_${school}`,{plans:{}});function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function key(){return area+'|'+group+'|'+plan}function groupData(){return matrix.areas?.[area]?.groups?.[group]||{name:'Agrupamiento '+(group+1),objective:'',items:[]}}function fresh(){return{name:'Plan '+(plan+1),synopsis:'',duration:'',time:'',customContents:[],customObjectives:[],weights:{'Punto de partida':25,'Indagación':25,'Producción':25,'Evaluación':25},criteria:Object.fromEntries(S.map(s=>[s,[{name:'Criterio 1',levels:['','','','']}]]))}}function P(){db.plans[key()]??=fresh();return db.plans[key()]}function save(){localStorage.setItem(`pciPlanDesignV1_school_${school}`,JSON.stringify(db));$('save').textContent='Guardado';setTimeout(()=>$('save').textContent='Guardar',700)}function total(){return S.reduce((a,s)=>a+(+P().weights[s]||0),0)}function render(){const p=P(),g=groupData();$('ctx').textContent=area+' · '+g.name+' · Plan '+(plan+1);$('title').textContent=p.name;$('info').innerHTML=`<div class="grid"><div><label>Nombre</label><input id="name" value="${p.name}"></div><div><label>Duración</label><input id="duration" value="${p.duration}"></div><div><label>Ubicación temporal</label><input id="time" value="${p.time}"></div><div><label>Sinopsis</label><textarea id="synopsis">${p.synopsis}</textarea></div></div>`;$('content').innerHTML=`<h2>Datos heredados de la Matriz PCI</h2><div class="row"><b>Objetivo del agrupamiento</b><p>${g.objective||'Sin objetivo cargado'}</p></div><div class="row"><b>Contenidos asignados</b><p>${(g.items||[]).length} contenidos disponibles para este plan.</p></div><label>Contenidos específicos del plan</label><textarea id="customContents">${p.customContents.join('\n')}</textarea><label>Objetivos específicos del plan</label><textarea id="customObjectives">${p.customObjectives.join('\n')}</textarea>`;$('rubric').innerHTML=`<h2>Rúbrica del plan</h2><div class="weights">${S.map(s=>`<div><label>${s}</label><input type="number" data-w="${s}" value="${p.weights[s]}"></div>`).join('')}</div><div class="status ${total()===100?'ok':''}">Total: ${total()} / 100</div>${S.map(s=>`<section class="stage"><h3>${s}</h3>${p.criteria[s].map((c,i)=>`<div class="row"><input data-cn="${s}|${i}" value="${c.name}"><div class="levels">${L.map((l,j)=>`<div><label>${l}</label><textarea data-lv="${s}|${i}|${j}">${c.levels[j]||''}</textarea></div>`).join('')}</div></div>`).join('')}<button class="btn mint" data-add="${s}">Agregar criterio</button></section>`).join('')}`;bind()}function bind(){const p=P();['name','duration','time','synopsis'].forEach(id=>$(id).oninput=()=>{p[id]=$(id).value;save();if(id==='name')$('title').textContent=p.name});$('customContents').oninput=()=>{p.customContents=$('customContents').value.split('\n').filter(Boolean);save()};$('customObjectives').oninput=()=>{p.customObjectives=$('customObjectives').value.split('\n').filter(Boolean);save()};document.querySelectorAll('[data-w]').forEach(e=>e.onchange=()=>{const old=p.weights[e.dataset.w];p.weights[e.dataset.w]=+e.value||0;if(total()>100){p.weights[e.dataset.w]=old;alert('La suma no puede superar 100')}save();render()});document.querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{const[s,i]=e.dataset.cn.split('|');p.criteria[s][+i].name=e.value;save()});document.querySelectorAll('[data-lv]').forEach(e=>e.oninput=()=>{const[s,i,j]=e.dataset.lv.split('|');p.criteria[s][+i].levels[+j]=e.value;save()});document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{p.criteria[e.dataset.add].push({name:'Nuevo criterio',levels:['','','','']});save();render()})}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===b.dataset.p))});$('save').onclick=save;render();</script></body></html>
