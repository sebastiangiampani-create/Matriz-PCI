<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trayectoria del estudiante</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7f8;color:#15374a}header{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #dbe5e8}header strong{margin-right:auto}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:#e7edef;color:#15374a}main{max-width:1100px;margin:auto;padding:18px 14px}.card{background:#fff;border:1px solid #dbe5e8;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:220px 1fr;gap:10px}select,input{width:100%;padding:10px;border:1px solid #dbe5e8;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#fff;border:1px solid #dbe5e8}.stat b{display:block;font-size:1.5rem}.ok{color:#167557}.warn{color:#9a6500}.bad{color:#b52f48}.plan{border-left:4px solid #83ded3}.stage{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #edf1f3}.pending{margin:8px 0 0 18px;color:#9a6500}.empty{padding:24px;text-align:center;color:#687985}.grade{font-weight:900;padding:10px;border-radius:10px;background:#edf5f6;margin-top:10px}@media(max-width:760px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><header><button class="btn" onclick="location.href='planes-arbol.html'">← Planes</button><strong>Trayectoria del estudiante</strong><button class="btn" onclick="location.href='evaluacion.html'">Evaluación</button></header><main><section class="card"><div class="grid"><select id="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select><select id="student"><option value="">Seleccionar estudiante</option></select></div></section><div id="body"></div></main><script>const ST=['Punto de partida','Indagación','Producción','Evaluación'],$=x=>document.getElementById(x);let design={},assess={plans:{}};function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function load(){const s=$('school').value;design=read(`pciPlanDesignV1_school_${s}`,{plans:{}});assess=read(`pciAssessmentV1_school_${s}`,{plans:{}});const names=[...new Set(Object.values(assess.plans).flatMap(p=>(p.students||[]).map(x=>x.name).filter(Boolean)))].sort();$('student').innerHTML='<option value="">Seleccionar estudiante</option>'+names.map(n=>`<option>${n}</option>`).join('');render()}function stageScore(st,p,stage){const cs=p.criteria?.[stage]||[];if(!cs.length)return 0;const sum=cs.reduce((a,c,i)=>a+(st.scores?.[stage]?.[i]??0),0);return sum/cs.length*(+p.weights?.[stage]||0)/10}function total(st,p){return ST.reduce((a,s)=>a+stageScore(st,p,s),0)}function render(){const name=$('student').value;if(!name){$('body').innerHTML='<div class="empty">Elegí un estudiante para ver su trayectoria.</div>';return}const rows=[];for(const[k,a]of Object.entries(assess.plans)){const st=(a.students||[]).find(x=>x.name===name),p=design.plans?.[k];if(st&&p)rows.push({k,st,p})}let complete=0,process=0,pendingCriteria=0;rows.forEach(r=>{const all=ST.every(s=>(r.p.criteria?.[s]||[]).every((c,i)=>typeof r.st.scores?.[s]?.[i]==='number'));if(all)complete++;else process++;ST.forEach(s=>(r.p.criteria?.[s]||[]).forEach((c,i)=>{if(typeof r.st.scores?.[s]?.[i]!=='number')pendingCriteria++}))});$('body').innerHTML=`<section class="stats"><div class="stat"><span>Planes registrados</span><b>${rows.length}</b></div><div class="stat ok"><span>Completos</span><b>${complete}</b></div><div class="stat warn"><span>En proceso</span><b>${process}</b></div><div class="stat bad"><span>Criterios pendientes</span><b>${pendingCriteria}</b></div></section>${rows.map(r=>planHTML(r)).join('')||'<div class="empty">Este estudiante todavía no tiene evaluaciones.</div>'}`}function planHTML(r){const parts=r.k.split('|'),name=r.p.name||`Plan ${+parts[2]+1}`,t=total(r.st,r.p);return `<article class="card plan"><h2>${parts[0]} · Agrupamiento ${+parts[1]+1} · ${name}</h2>${ST.map(s=>{const cs=r.p.criteria?.[s]||[],miss=cs.map((c,i)=>typeof r.st.scores?.[s]?.[i]==='number'?null:c.name).filter(Boolean);return `<div class="stage"><b>${s}</b><span>${stageScore(r.st,r.p,s).toFixed(2)} / ${r.p.weights?.[s]||0}</span></div>${miss.length?`<ul class="pending">${miss.map(x=>`<li>Falta evaluar: ${x}</li>`).join('')}</ul>`:'<div class="ok">Etapa completa</div>'}`}).join('')}<div class="grade">Total: ${t.toFixed(2)} / 100 · ${t<60?'En proceso':'Finalizado · '+Math.round(t/10)}</div></article>`}$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=load;$('student').onchange=render;load();</script></body></html>
