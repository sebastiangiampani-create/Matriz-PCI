<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trayectoria · Plataforma PCI</title><style>:root{--ink:#15374a;--mint:#83ded3;--bg:#f4f7f8;--line:#dbe5e8;--muted:#687985}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:5;display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}.identity{display:flex;align-items:center;gap:9px;margin-right:auto}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mint);font-weight:950}.identity small{display:block;color:var(--muted);font-weight:800}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer;text-decoration:none}.btn.active{background:var(--ink);color:#fff}main{max-width:1100px;margin:auto;padding:18px 14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:220px 1fr;gap:10px}select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line)}.stat b{display:block;font-size:1.5rem}.ok{color:#167557}.warn{color:#9a6500}.bad{color:#b52f48}.plan{border-left:4px solid var(--mint)}.stage{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #edf1f3}.pending{margin:8px 0 0 18px;color:#9a6500}.empty,.error{padding:24px;text-align:center;border-radius:14px;background:#fff;border:1px dashed var(--line);color:var(--muted)}.error{color:#a1283f;border-color:#e9b7c1;background:#fff7f8}.grade{font-weight:900;padding:10px;border-radius:10px;background:#edf5f6;margin-top:10px}@media(max-width:820px){.identity{width:100%}.nav{width:100%;overflow:auto}.grid,.stats{grid-template-columns:1fr}}</style></head><body><header><div class="identity"><div class="logo">EM</div><div><small>Escuela de Maestros</small><strong>Trayectoria del estudiante</strong></div></div><a class="btn" href="evaluacion.html">← Volver a Evaluación</a><nav class="nav"><a class="btn" href="plataforma.html">Inicio</a><a class="btn" href="launcher.html?v=10">Matriz PCI</a><a class="btn" href="planes-arbol.html">Planes</a><a class="btn" href="evaluacion.html">Evaluación</a><a class="btn active" href="trayectoria.html">Trayectoria</a></nav></header><main><section class="card"><h1>Seguimiento de trayectoria</h1><p>Seleccioná una escuela y un estudiante para consultar sus avances y pendientes.</p><div class="grid"><select id="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select><select id="student"><option value="">Seleccionar estudiante</option></select></div></section><div id="body"></div></main><script>(function(){var ST=['Punto de partida','Indagación','Producción','Evaluación'];function $(x){return document.getElementById(x)}function read(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function safePlans(x){return x&&x.plans&&typeof x.plans==='object'?x:{plans:{}}}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}var design={plans:{}},assess={plans:{}};function normalizePlan(p){p=p||{};p.weights=p.weights||{};p.criteria=p.criteria||{};ST.forEach(function(s){if(!Array.isArray(p.criteria[s]))p.criteria[s]=[]});return p}function load(){try{var s=$('school').value;design=safePlans(read('pciPlanDesignV1_school_'+s,{plans:{}}));assess=safePlans(read('pciAssessmentV1_school_'+s,{plans:{}}));var names=[];Object.keys(assess.plans).forEach(function(k){var a=assess.plans[k];if(a&&Array.isArray(a.students))a.students.forEach(function(st){if(st&&st.name&&names.indexOf(st.name)<0)names.push(st.name)})});names.sort();$('student').innerHTML='<option value="">Seleccionar estudiante</option>'+names.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join('');render()}catch(e){showError(e)}}function stageScore(st,p,s){var cs=p.criteria[s]||[];if(!cs.length)return 0;var sum=0;for(var i=0;i<cs.length;i++)sum+=Number(st.scores&&st.scores[s]&&st.scores[s][i]!==undefined?st.scores[s][i]:0);return sum/cs.length*Number(p.weights[s]||0)/10}function total(st,p){var n=0;ST.forEach(function(s){n+=stageScore(st,p,s)});return n}function render(){try{var name=$('student').value;if(!name){$('body').innerHTML='<div class="empty">Elegí un estudiante para ver su trayectoria.</div>';return}var rows=[];Object.keys(assess.plans).forEach(function(k){var a=assess.plans[k],p=design.plans[k];if(!a||!Array.isArray(a.students)||!p)return;var st=a.students.find(function(x){return x&&x.name===name});if(st)rows.push({k:k,st:st,p:normalizePlan(p)})});var complete=0,process=0,pendingCriteria=0;rows.forEach(function(r){var all=true;ST.forEach(function(s){(r.p.criteria[s]||[]).forEach(function(c,i){if(!(r.st.scores&&r.st.scores[s]&&typeof r.st.scores[s][i]==='number')){all=false;pendingCriteria++}})});if(all)complete++;else process++});$('body').innerHTML='<section class="stats"><div class="stat"><span>Planes registrados</span><b>'+rows.length+'</b></div><div class="stat ok"><span>Completos</span><b>'+complete+'</b></div><div class="stat warn"><span>En proceso</span><b>'+process+'</b></div><div class="stat bad"><span>Criterios pendientes</span><b>'+pendingCriteria+'</b></div></section>'+(rows.length?rows.map(planHTML).join(''):'<div class="empty">Este estudiante todavía no tiene evaluaciones registradas.</div>')}catch(e){showError(e)}}function planHTML(r){var parts=r.k.split('|'),name=r.p.name||('Plan '+(Number(parts[2]||0)+1)),t=total(r.st,r.p),html='<article class="card plan"><h2>'+esc(parts[0]||'Área')+' · Agrupamiento '+(Number(parts[1]||0)+1)+' · '+esc(name)+'</h2>';ST.forEach(function(s){var cs=r.p.criteria[s]||[],miss=[];cs.forEach(function(c,i){if(!(r.st.scores&&r.st.scores[s]&&typeof r.st.scores[s][i]==='number'))miss.push(c&&c.name||('Criterio '+(i+1)))});html+='<div class="stage"><b>'+esc(s)+'</b><span>'+stageScore(r.st,r.p,s).toFixed(2)+' / '+Number(r.p.weights[s]||0)+'</span></div>';if(miss.length)html+='<ul class="pending">'+miss.map(function(x){return '<li>Falta evaluar: '+esc(x)+'</li>'}).join('')+'</ul>';else html+='<div class="ok">Etapa completa</div>'});html+='<div class="grade">Total: '+t.toFixed(2)+' / 100 · '+(t<60?'En proceso':'Finalizado · '+Math.round(t/10))+'</div></article>';return html}function showError(e){$('body').innerHTML='<div class="error"><b>No se pudo cargar la trayectoria.</b><br>Primero guardá un plan y registrá al menos una evaluación.<br><small>'+esc(e&&e.message||'Error de datos')+'</small></div>'}$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=load;$('student').onchange=render;load()})();</script></body></html>
