<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planes de aprendizaje</title><style>:root{--ink:#15374a;--mint:#83ded3;--bg:#f4f7f8;--line:#dbe5e8;--muted:#687985;--ok:#167557;--warn:#9a6500;--bad:#b52f48}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}.top strong{margin-right:auto}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:850;background:#e7edef;color:var(--ink);cursor:pointer}.btn.primary{background:var(--ink);color:#fff}.btn.mint{background:var(--mint)}.btn.danger{background:#ffe9ee;color:var(--bad)}main{width:min(1350px,100%);margin:auto;padding:20px 14px 80px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.intro{color:var(--muted);margin-top:4px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.step{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;text-align:left;font-weight:850;cursor:pointer}.step small{display:block;color:var(--muted);font-weight:700;margin-top:3px}.step.active{background:var(--ink);color:#fff}.step.active small{color:#dfe9ec}.step.done{border-color:var(--mint)}.panel{display:none}.panel.active{display:block}.help{padding:14px;border-left:5px solid var(--mint);background:#effaf8;border-radius:12px;margin:12px 0 18px}.selectors,.grid2,.grid4{display:grid;gap:12px}.selectors{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:repeat(4,1fr)}.field label{display:block;font-size:.83rem;font-weight:850;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:100px;resize:vertical}.list{display:grid;gap:8px}.choice{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fbfcfc}.choice input[type=checkbox]{width:19px;height:19px}.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}.addrow input{border:1px solid var(--line);border-radius:10px;padding:10px}.stage-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.stage{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-weight:850}.stage.active{background:var(--mint)}.status{padding:12px;border-radius:12px;font-weight:900;margin:12px 0}.ok{background:#e5f6ef;color:var(--ok)}.warn{background:#fff3d8;color:var(--warn)}.bad{background:#ffe9ee;color:var(--bad)}.criterion{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.criterion-head{display:grid;grid-template-columns:1fr auto;gap:8px}.criterion-head input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:850}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.levels textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.82rem}.levels label{font-size:.78rem;font-weight:850}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.toolbar .spacer{flex:1}.student{margin:12px 0}.student-head{display:flex;gap:8px;align-items:center}.student-head input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}.matrix{overflow:auto;margin-top:10px}.matrix table{width:100%;border-collapse:collapse;min-width:900px}.matrix th,.matrix td{border:1px solid var(--line);padding:8px}.matrix th{background:#edf5f6}.score{font-weight:900;text-align:center}.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:16px}@media(max-width:900px){.steps,.selectors,.grid2,.grid4,.levels{grid-template-columns:1fr}.top{flex-wrap:wrap}.top strong{width:100%}}</style></head><body><header class="top"><strong>Escuela de Maestros · Planes de aprendizaje</strong><button class="btn" onclick="location.href='launcher.html?v=10'">← Volver a la Matriz PCI</button><button id="save" class="btn mint">Guardar</button></header><main><section class="card"><h1>Asistente para crear y evaluar un plan</h1><p class="intro">El módulo toma contenidos y objetivos de la Matriz PCI, pero guarda todo lo nuevo por separado. Nada de lo que hagas acá modifica la matriz original.</p><div id="steps" class="steps"><button class="step active" data-step="1">Paso 1<small>Elegir plan</small></button><button class="step" data-step="2">Paso 2<small>Configurar</small></button><button class="step" data-step="3">Paso 3<small>Etapas y criterios</small></button><button class="step" data-step="4">Paso 4<small>Estudiantes</small></button><button class="step" data-step="5">Paso 5<small>Resultados</small></button></div><div id="p1" class="panel active"></div><div id="p2" class="panel"></div><div id="p3" class="panel"></div><div id="p4" class="panel"></div><div id="p5" class="panel"></div></section></main><footer>Diseñado por Sebastián Giampani</footer><script>const STAGES=['PUNTO DE PARTIDA','INDAGACIÓN','PRODUCCIÓN','EVALUACIÓN'],LEVELS=['En proceso','Iniciado (6–7)','Suficiente (8–9)','Avanzado (10)'],SCORES=[0,6.5,8.5,10];const BASE={'PUNTO DE PARTIDA':[['Activación de saberes previos','No se registran saberes previos vinculados.','Menciona saberes previos de manera aislada.','Vincula saberes previos con la temática.','Revisa y fundamenta sus supuestos previos.'],['Formulación de hipótesis y predicciones','No formula respuestas tentativas.','Formula preguntas sin arriesgar respuestas.','Plantea hipótesis con alguna razón.','Formula hipótesis y anticipa cómo verificarlas.']],'INDAGACIÓN':[['Búsqueda y selección de información','No consulta fuentes.','Consulta fuentes sin evaluar pertinencia.','Selecciona información pertinente.','Contrasta fuentes y fundamenta elecciones.'],['Sistematización y análisis','No organiza los datos.','Enumera datos sin organización suficiente.','Organiza información principal y secundaria.','Elige y justifica la herramienta de organización.'],['Comprensión y rigurosidad','No hay análisis propio.','Reproduce definiciones.','Explica y aplica conceptos con precisión.','Relaciona conceptos, matices y límites.']],'PRODUCCIÓN':[['Producción individual','No presenta producción evaluable.','Entrega una producción parcial.','Completa la producción aplicando contenidos.','Resuelve con autonomía y fundamenta.'],['Trabajo colaborativo','No se registra participación.','Cumple una parte asignada.','Aporta ideas y sostiene su rol.','Organiza, integra aportes y resuelve desacuerdos.'],['Resolución de situaciones problema','No aborda la situación.','Aplica procedimientos conocidos con errores.','Selecciona el procedimiento adecuado.','Resuelve situaciones nuevas y justifica.']],'EVALUACIÓN':[['Contextualización y transferencia','No vincula contenidos con el entorno.','Menciona ejemplos sin explicar relación.','Vincula conocimientos con situaciones de contexto.','Reconoce alcances y límites.'],['Integración en proyectos','No utiliza lo aprendido.','Aplica parcialmente con ayuda.','Usa contenidos para resolver y fundamentar.','Integra contenidos y anticipa consecuencias.'],['Comunicación y exposición','No presenta comunicación evaluable.','Comunica de forma fragmentaria.','Expone con claridad y estructura.','Adecua la exposición y responde repreguntas.'],['Metacognición y autorregulación','No registra reflexión.','Describe lo realizado.','Identifica fortalezas y dificultades.','Analiza estrategias y formula mejoras.']]};let DATA=[],pci={areas:{}},db={plans:{}},step=1,stage=STAGES[0],studentStage=STAGES[0];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadData(){const f=['data/db1.txt','data/db2.txt','data/db3.txt','data/db4.txt','data/rest1.txt','data/rest2.txt','data/rest3.txt','data/rest4.txt','data/rest5.txt'];const b=(await Promise.all(f.map(x=>fetch(x).then(r=>r.text())))).join('');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();DATA=JSON.parse(t).map(([id,area,subject,axis,text])=>({id,area,subject,axis,text}))}function sk(){return`pciPlansV3_school_${$('school')?.value||localStorage.getItem('pciActiveSchool')||'1'}`}function loadSchool(){const s=$('school')?.value||localStorage.getItem('pciActiveSchool')||'1';pci=JSON.parse(localStorage.getItem(`pciAppV2_school_${s}`)||localStorage.getItem('pciAppV2')||'{"areas":{}}');db=JSON.parse(localStorage.getItem(`pciPlansV3_school_${s}`)||'{"plans":{}}')}function save(){localStorage.setItem(sk(),JSON.stringify(db));$('save').textContent='Guardado';setTimeout(()=>$('save').textContent='Guardar',800)}function group(){return pci.areas?.[$('area')?.value]?.groups?.[+$('group')?.value]}function count(){return['Ciencias Sociales','Ciencias Naturales','Artes','Tecnologías','Educación Física'].includes($('area')?.value)?2:4}function pk(){return[$('area')?.value,$('group')?.value,$('plan')?.value].join('|')}function criteria(){return Object.fromEntries(STAGES.map(s=>[s,BASE[s].map((x,i)=>({id:`b-${i}`,name:x[0],levels:x.slice(1)}))]))}function ensure(){const k=pk();if(!db.plans[k])db.plans[k]={name:`Plan ${+$('plan').value+1}`,duration:'1 bimestre',time:'',synopsis:'',selected:[],customContents:[],useObjective:true,customObjectives:[],weights:Object.fromEntries(STAGES.map(s=>[s,25])),stages:Object.fromEntries(STAGES.map(s=>[s,{intro:'',duration:'',resources:'',activities:''}])),criteria:criteria(),students:[]};return db.plans[k]}function go(n){step=n;document.querySelectorAll('.step').forEach(b=>{b.classList.toggle('active',+b.dataset.step===n);b.classList.toggle('done',+b.dataset.step<n)});document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===`p${n}`));render()}function nav(prev,next){return `<div class="toolbar">${prev?`<button class="btn" data-go="${prev}">← Anterior</button>`:''}<span class="spacer"></span>${next?`<button class="btn primary" data-go="${next}">Guardar y continuar →</button>`:''}</div>`}function bindNav(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{save();go(+b.dataset.go)})}function render1(){const areas=Object.keys(pci.areas||{}),a=$('area')?.value||areas[0]||'',gs=pci.areas?.[a]?.groups||[];$('p1').innerHTML=`<div class="help"><b>¿Qué hago en este paso?</b><br>Elegí la escuela, el área, el agrupamiento y el plan. El sistema tomará lo ya cargado en la Matriz PCI sin modificarlo.</div><div class="selectors"><div class="field"><label>Escuela</label><select id="school"><option value="1">Escuela 1</option><option value="2">Escuela 2</option><option value="3">Escuela 3</option></select></div><div class="field"><label>Área</label><select id="area">${areas.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Agrupamiento</label><select id="group">${gs.map((g,i)=>`<option value="${i}">${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>Plan</label><select id="plan">${Array.from({length:count()},(_,i)=>`<option value="${i}">Plan ${i+1}</option>`).join('')}</select></div></div>${nav(0,2)}`;$('school').value=localStorage.getItem('pciActiveSchool')||'1';$('school').onchange=()=>{loadSchool();render1()};$('area').onchange=()=>render1();$('group').onchange=()=>render1();$('plan').onchange=()=>{};bindNav()}function inherited(){return(group()?.items||[]).map(id=>DATA.find(x=>x.id===id)).filter(Boolean)}function render2(){const p=ensure(),g=group(),rows=inherited();$('p2').innerHTML=`<div class="help"><b>¿Qué hago en este paso?</b><br>Completá los datos generales. Elegí qué contenidos y objetivos heredados usará este plan. También podés agregar otros específicos, que quedarán solo acá.</div><div class="grid2"><div class="field"><label>Nombre del plan</label><input id="name" value="${esc(p.name)}"></div><div class="field"><label>Duración</label><input id="duration" value="${esc(p.duration)}"></div><div class="field"><label>Ubicación temporal</label><input id="time" value="${esc(p.time)}"></div><div class="field"><label>Sinopsis</label><textarea id="synopsis">${esc(p.synopsis)}</textarea></div></div><h2>Contenidos heredados</h2><p class="intro">Vienen del agrupamiento. Marcarlos o desmarcarlos no modifica la Matriz PCI.</p><div class="list">${rows.length?rows.map(x=>`<label class="choice"><input type="checkbox" data-content="${x.id}" ${p.selected.includes(x.id)?'checked':''}><span><b>${esc(x.subject)}</b><br>${esc(x.text)}</span></label>`).join(''):'<div class="empty">No hay contenidos asignados en este agrupamiento.</div>'}</div><h3>Contenidos específicos del plan</h3><div class="list">${p.customContents.map((x,i)=>`<div class="choice"><span></span><span>${esc(x)}</span><button class="btn danger" data-rmc="${i}">Eliminar</button></div>`).join('')}</div><div class="addrow"><input id="newC" placeholder="Agregar contenido específico"><button id="addC" class="btn mint">Agregar</button></div><h2>Objetivos</h2><label class="choice"><input id="useObj" type="checkbox" ${p.useObjective?'checked':''}><span><b>Objetivo heredado</b><br>${esc(g?.objective||'El agrupamiento todavía no tiene objetivo cargado.')}</span></label><h3>Objetivos específicos</h3><div class="list">${p.customObjectives.map((x,i)=>`<div class="choice"><span></span><span>${esc(x)}</span><button class="btn danger" data-rmo="${i}">Eliminar</button></div>`).join('')}</div><div class="addrow"><input id="newO" placeholder="Agregar objetivo específico"><button id="addO" class="btn mint">Agregar</button></div>${nav(1,3)}`;['name','duration','time','synopsis'].forEach(id=>$(id).oninput=()=>{p[id==='name'?'name':id]=$ (id).value;save()});document.querySelectorAll('[data-content]').forEach(e=>e.onchange=()=>{p.selected=e.checked?[...new Set([...p.selected,e.dataset.content])]:p.selected.filter(x=>x!==e.dataset.content);save()});$('useObj').onchange=()=>{p.useObjective=$('useObj').checked;save()};$('addC').onclick=()=>{const v=$('newC').value.trim();if(v){p.customContents.push(v);save();render2()}};$('addO').onclick=()=>{const v=$('newO').value.trim();if(v){p.customObjectives.push(v);save();render2()}};document.querySelectorAll('[data-rmc]').forEach(e=>e.onclick=()=>{p.customContents.splice(+e.dataset.rmc,1);save();render2()});document.querySelectorAll('[data-rmo]').forEach(e=>e.onclick=()=>{p.customObjectives.splice(+e.dataset.rmo,1);save();render2()});bindNav()}function totalW(){const p=ensure();return STAGES.reduce((a,s)=>a+(+p.weights[s]||0),0)}function render3(){const p=ensure(),st=p.stages[stage];$('p3').innerHTML=`<div class="help"><b>¿Qué hago en este paso?</b><br>Distribuí hasta 100 puntos entre las cuatro etapas. Después completá la planificación y editá los criterios y niveles de logro de cada etapa.</div><div class="grid4">${STAGES.map(s=>`<div class="field"><label>${s}</label><input type="number" min="0" max="100" step="0.5" data-w="${s}" value="${p.weights[s]}"></div>`).join('')}</div><div class="status ${totalW()===100?'ok':'warn'}">Total asignado: ${totalW()} / 100 · Disponible: ${Math.max(0,100-totalW())}</div><div class="stage-tabs">${STAGES.map(s=>`<button class="stage ${s===stage?'active':''}" data-stage="${s}">${s}</button>`).join('')}</div><h2>${stage}</h2><div class="grid2"><div class="field"><label>Encabezado para estudiantes</label><textarea id="intro">${esc(st.intro)}</textarea></div><div><div class="field"><label>Duración estimada</label><input id="sdur" value="${esc(st.duration)}"></div><div class="field" style="margin-top:10px"><label>Recursos</label><textarea id="resources">${esc(st.resources)}</textarea></div></div></div><div class="field"><label>Actividades</label><textarea id="activities" style="min-height:150px">${esc(st.activities)}</textarea></div><h2>Criterios y niveles de logro</h2><p class="intro">Todo es editable para este plan.</p>${p.criteria[stage].map((c,i)=>`<article class="criterion"><div class="criterion-head"><input data-cn="${i}" value="${esc(c.name)}"><button class="btn danger" data-rmcr="${i}">Eliminar</button></div><div class="levels">${LEVELS.map((l,j)=>`<div><label>${l}</label><textarea data-lv="${i}|${j}">${esc(c.levels[j]||'')}</textarea></div>`).join('')}</div></article>`).join('')}<button id="addCr" class="btn mint">Agregar criterio</button>${nav(2,4)}`;document.querySelectorAll('[data-w]').forEach(e=>e.onchange=()=>{const old=p.weights[e.dataset.w];p.weights[e.dataset.w]=+e.value||0;if(totalW()>100){p.weights[e.dataset.w]=old;alert('La suma no puede superar 100.')}save();render3()});document.querySelectorAll('[data-stage]').forEach(e=>e.onclick=()=>{stage=e.dataset.stage;render3()});['intro','sdur','resources','activities'].forEach(id=>$(id).oninput=()=>{const map={intro:'intro',sdur:'duration',resources:'resources',activities:'activities'};st[map[id]]=$(id).value;save()});document.querySelectorAll('[data-cn]').forEach(e=>e.oninput=()=>{p.criteria[stage][+e.dataset.cn].name=e.value;save()});document.querySelectorAll('[data-lv]').forEach(e=>e.oninput=()=>{const[i,j]=e.dataset.lv.split('|').map(Number);p.criteria[stage][i].levels[j]=e.value;save()});document.querySelectorAll('[data-rmcr]').forEach(e=>e.onclick=()=>{p.criteria[stage].splice(+e.dataset.rmcr,1);save();render3()});$('addCr').onclick=()=>{p.criteria[stage].push({id:'c'+Date.now(),name:'Nuevo criterio',levels:['','','','']});save();render3()};bindNav()}function ensureSt(s){s.scores=s.scores||{};s.enabled=s.enabled||{};STAGES.forEach(x=>{s.scores[x]=s.scores[x]||{};s.enabled[x]=s.enabled[x]||{}})}function stageScore(s,st){ensureSt(s);const p=ensure(),cs=p.criteria[st].filter(c=>s.enabled[st][c.id]!==false),vals=cs.map(c=>s.scores[st][c.id]).filter(v=>typeof v==='number');return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length*(+p.weights[st]||0)/10:0}function totalScore(s){return STAGES.reduce((a,x)=>a+stageScore(s,x),0)}function render4(){const p=ensure();$('p4').innerHTML=`<div class="help"><b>¿Qué hago en este paso?</b><br>Elegí una etapa, agregá estudiantes y asigná el nivel de logro alcanzado en cada criterio. Podés desactivar criterios distintos para cada estudiante.</div><div class="stage-tabs">${STAGES.map(s=>`<button class="stage ${s===studentStage?'active':''}" data-sstage="${s}">${s}</button>`).join('')}</div><div class="status ok">Evaluando: ${studentStage} · máximo ${p.weights[studentStage]} puntos</div><button id="addStudent" class="btn primary">Agregar estudiante</button>${p.students.length?p.students.map((s,i)=>studentHTML(s,i)).join(''):'<div class="empty" style="margin-top:12px">Todavía no hay estudiantes cargados.</div>'}${nav(3,5)}`;document.querySelectorAll('[data-sstage]').forEach(e=>e.onclick=()=>{studentStage=e.dataset.sstage;render4()});$('addStudent').onclick=()=>{p.students.push({name:'',scores:{},enabled:{}});save();render4()};document.querySelectorAll('[data-sn]').forEach(e=>e.oninput=()=>{p.students[+e.dataset.sn].name=e.value;save()});document.querySelectorAll('[data-rms]').forEach(e=>e.onclick=()=>{p.students.splice(+e.dataset.rms,1);save();render4()});document.querySelectorAll('[data-en]').forEach(e=>e.onchange=()=>{const[i,id]=e.dataset.en.split('|'),s=p.students[+i];ensureSt(s);s.enabled[studentStage][id]=e.checked;if(!e.checked)delete s.scores[studentStage][id];save();render4()});document.querySelectorAll('[data-sc]').forEach(e=>e.onchange=()=>{const[i,id]=e.dataset.sc.split('|'),s=p.students[+i];ensureSt(s);if(e.value==='')delete s.scores[studentStage][id];else s.scores[studentStage][id]=+e.value;save();render4()});bindNav()}function studentHTML(s,i){ensureSt(s);const p=ensure();return `<article class="student card"><div class="student-head"><input data-sn="${i}" value="${esc(s.name||'')}" placeholder="Nombre del estudiante"><button class="btn danger" data-rms="${i}">Eliminar</button></div><div class="matrix"><table><thead><tr><th>Usar</th><th>Criterio</th><th>Nivel de logro</th><th>Puntaje base</th></tr></thead><tbody>${p.criteria[studentStage].map(c=>{const en=s.enabled[studentStage][c.id]!==false,v=s.scores[studentStage][c.id];return `<tr><td><input type="checkbox" data-en="${i}|${c.id}" ${en?'checked':''}></td><td>${esc(c.name)}</td><td><select data-sc="${i}|${c.id}" ${en?'':'disabled'}><option value="">Sin evaluar</option>${LEVELS.map((l,j)=>`<option value="${SCORES[j]}" ${v===SCORES[j]?'selected':''}>${l}</option>`).join('')}</select></td><td class="score">${typeof v==='number'?v:'—'}</td></tr>`}).join('')}<tr><td colspan="3"><b>Subtotal de la etapa</b></td><td class="score">${stageScore(s,studentStage).toFixed(2)} / ${p.weights[studentStage]}</td></tr></tbody></table></div></article>`}function render5(){const p=ensure(),tw=totalW();$('p5').innerHTML=`<div class="help"><b>¿Qué muestra este paso?</b><br>Acá se suman los puntajes de las cuatro etapas y se calcula el porcentaje final de cada estudiante.</div><div class="status ${tw===100?'ok':'warn'}">Valor máximo actual del plan: ${tw} / 100</div>${p.students.length?`<div class="matrix"><table><thead><tr><th>Estudiante</th>${STAGES.map(s=>`<th>${s}<br><small>Máx. ${p.weights[s]}</small></th>`).join('')}<th>Total</th><th>Porcentaje</th></tr></thead><tbody>${p.students.map(s=>`<tr><td>${esc(s.name||'Sin nombre')}</td>${STAGES.map(st=>`<td>${stageScore(s,st).toFixed(2)}</td>`).join('')}<td><b>${totalScore(s).toFixed(2)} / ${tw}</b></td><td>${tw?((totalScore(s)/tw)*100).toFixed(1):0}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay estudiantes evaluados.</div>'}${nav(4,0)}`;bindNav()}function render(){if(step===1)render1();else if(!group()){go(1)}else if(step===2)render2();else if(step===3)render3();else if(step===4)render4();else render5()}document.querySelectorAll('.step').forEach(b=>b.onclick=()=>go(+b.dataset.step));$('save').onclick=save;(async()=>{await loadData();loadSchool();render()})().catch(e=>{$('p1').innerHTML='<div class="empty">No se pudo cargar la base de contenidos.</div>';console.error(e)});</script></body></html>
