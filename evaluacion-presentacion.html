<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evaluación · Presentación</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7f8;color:#15374a}header{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #dbe5e8}header strong{margin-right:auto}.tag,.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900}.tag{background:#fff3d8;color:#805600}.btn{background:#e7edef;color:#15374a;cursor:pointer}.mint{background:#83ded3}main{max-width:1050px;margin:auto;padding:18px 14px}.card{background:#fff;border:1px solid #dbe5e8;border-radius:18px;padding:16px;margin-bottom:12px}select,input{width:100%;padding:10px;border:1px solid #dbe5e8;border-radius:10px}.criterion{display:grid;grid-template-columns:1fr 230px;gap:10px;align-items:center;margin:8px 0}.stage{border-top:1px solid #dbe5e8;padding-top:12px;margin-top:12px}.total{padding:10px;border-radius:10px;background:#edf5f6;font-weight:900}.empty{padding:22px;text-align:center;color:#687985}@media(max-width:700px){.criterion{grid-template-columns:1fr}}</style></head><body><header><span class="tag">PRESENTACIÓN</span><strong>Evaluación</strong><button class="btn" onclick="location.href='presentacion.html'">← Inicio</button><button id="save" class="btn mint">Guardar demo</button></header><main><section class="card"><label>Plan</label><select id="plan"></select></section><div id="students"></div></main><script>(function(){var ST=['Punto de partida','Indagación','Producción','Evaluación'],LV=['En proceso','Iniciado','Suficiente','Avanzado'],SC=[0,6.5,8.5,10];function $(x){return document.getElementById(x)}function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}var design=read('pciDemoPlanDesignV1_school_1',{plans:{}}),db=read('pciDemoAssessmentV1_school_1',{plans:{}});function save(){localStorage.setItem('pciDemoAssessmentV1_school_1',JSON.stringify(db));$('save').textContent='Guardado';setTimeout(function(){$('save').textContent='Guardar demo'},700)}function current(){var k=$('plan').value;if(!k)return null;if(!db.plans[k])db.plans[k]={students:[]};return db.plans[k]}function score(st,p,s){var cs=p.criteria[s]||[];if(!cs.length)return 0;var sum=0;cs.forEach(function(c,i){sum+=Number(st.scores&&st.scores[s]&&st.scores[s][i]!==undefined?st.scores[s][i]:0)});return sum/cs.length*Number(p.weights[s]||0)/10}function total(st,p){return ST.reduce(function(a,s){return a+score(st,p,s)},0)}function render(){var k=$('plan').value,p=design.plans[k],e=current();if(!p||!e){$('students').innerHTML='<div class="empty">No hay datos de presentación.</div>';return}if(!e.students.length)e.students.push({name:'Fran Demo',scores:{}});$('students').innerHTML=e.students.map(function(st,si){var html='<article class="card"><h2>'+st.name+'</h2>';ST.forEach(function(s){html+='<section class="stage"><h3>'+s+'</h3>';(p.criteria[s]||[]).forEach(function(c,ci){var v=st.scores&&st.scores[s]&&st.scores[s][ci]!==undefined?st.scores[s][ci]:'';html+='<div class="criterion"><b>'+c.name+'</b><select data-score="'+si+'|'+s+'|'+ci+'"><option value="">Sin evaluar</option>'+LV.map(function(l,j){return'<option value="'+SC[j]+'" '+(String(v)===String(SC[j])?'selected':'')+'>'+l+'</option>'}).join('')+'</select></div>'});html+='<div class="total">Subtotal: '+score(st,p,s).toFixed(2)+' / '+p.weights[s]+'</div></section>'});var t=total(st,p);return html+'<div class="total">Total: '+t.toFixed(2)+' / 100 · '+(t<60?'En proceso':'Finalizado · '+Math.round(t/10))+'</div></article>'}).join('');document.querySelectorAll('[data-score]').forEach(function(el){el.onchange=function(){var a=this.dataset.score.split('|'),st=current().students[Number(a[0])];st.scores=st.scores||{};st.scores[a[1]]=st.scores[a[1]]||{};if(this.value==='')delete st.scores[a[1]][a[2]];else st.scores[a[1]][a[2]]=Number(this.value);save();render()}})}$('plan').innerHTML=Object.keys(design.plans).map(function(k){return'<option value="'+k+'">'+design.plans[k].name+'</option>'}).join('');$('plan').onchange=render;$('save').onclick=save;render()})();</script></body></html>
