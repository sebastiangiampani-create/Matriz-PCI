<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formatos y horas</title><style>:root{--ink:#15374a;--bg:#eef3f4;--line:#d7e2e5;--mint:#83ded3;--muted:#687985;--bad:#b52f48;--ok:#167557}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{display:grid;gap:5px;font-size:.82rem;font-weight:850}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--ink)}textarea{min-height:88px}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer;background:#e7edef;color:var(--ink)}.btn.primary{background:var(--ink);color:#fff}.btn.danger{background:#ffe9ee;color:var(--bad)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{border:1px solid var(--line);padding:7px;text-align:center}th{background:#edf5f6}.formats{display:grid;gap:10px}.format{border:1px solid var(--line);border-radius:14px;padding:12px}.format-head{display:flex;gap:8px;align-items:center}.format-head h3{margin:0 auto 0 0}.desc{color:var(--muted);font-size:.8rem}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}@media(max-width:850px){.fields{grid-template-columns:1fr}}</style></head><body><main><h1>Formatos curriculares y carga horaria</h1><p>Creá Seminarios, Proyectos y Proyectos Sociocomunitarios; asignales áreas, contenidos, cuatrimestre y horas semanales.</p><section class="card"><h2>Nuevo formato curricular</h2><div class="fields"><label>Nombre<input id="name"></label><label>Tipo<select id="type"><option>Seminario</option><option>Proyecto</option><option>Proyecto Sociocomunitario Solidario</option></select></label><label>Cuatrimestre<select id="term"></select></label><label>Horas semanales<input id="hours" type="number" min="0" step="1" value="1"></label><label>Carácter<select id="character"><option>Obligatorio</option><option>Electivo</option></select></label><label>Áreas de origen<input id="areas" placeholder="Ciencias Sociales, Ciencias Naturales"></label></div><div class="fields" style="margin-top:10px"><label style="grid-column:span 3">Objetivos<textarea id="objective"></textarea></label><label style="grid-column:span 3">Contexto / descripción<textarea id="context"></textarea></label><label style="grid-column:span 3">Contenidos seleccionados (IDs separados por coma)<textarea id="items"></textarea></label></div><div class="toolbar"><button id="add" class="btn primary">Agregar formato</button></div></section><section class="card"><h2>Formatos creados</h2><div id="formats" class="formats"></div></section><section class="card"><h2>Carga horaria semanal por cuatrimestre</h2><div class="table"><table><thead><tr><th>Área</th><th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>C5</th><th>C6</th><th>C7</th><th>C8</th><th>C9</th><th>C10</th></tr></thead><tbody id="hoursTable"></tbody></table></div><div class="toolbar"><button id="save" class="btn primary">Guardar cambios</button></div></section></main><script>const $=id=>document.getElementById(id);let app={areas:{},otherFormats:[],hourAssignments:{}};try{app=JSON.parse(localStorage.getItem('pciAppV2')||'{}')}catch{};if(!app.areas)app.areas={};if(!Array.isArray(app.otherFormats))app.otherFormats=[];if(!app.hourAssignments)app.hourAssignments={};for(let i=1;i<=10;i++)$('term').insertAdjacentHTML('beforeend',`<option value="${i}">C${i} · Nivel ${Math.ceil(i/2)}</option>`);const typeDesc={Seminario:'Espacio delimitado de indagación teórica e investigación sobre un tema o recorte específico de conocimiento.',Proyecto:'Unidad didáctica organizada alrededor de un problema práctico o una pregunta central que requiere una solución concreta.','Proyecto Sociocomunitario Solidario':'Propuesta pedagógica institucional articulada directamente con organizaciones de la comunidad externa.'};function persist(){localStorage.setItem('pciAppV2',JSON.stringify(app));$('save').textContent='Guardado';setTimeout(()=>$('save').textContent='Guardar cambios',900)}function renderFormats(){$('formats').innerHTML=app.otherFormats.length?app.otherFormats.map((f,i)=>`<article class="format"><div class="format-head"><h3>${f.name||'Sin nombre'}</h3><button class="btn danger" data-del="${i}">Eliminar</button></div><div class="desc"><b>${f.formatType||f.type}</b> · C${f.term} · ${Number(f.weeklyHours||f.hours||0)} h semanales · ${f.character||'Obligatorio'}</div><p>${typeDesc[f.formatType||f.type]||''}</p><p><b>Áreas:</b> ${(f.areas||[]).join(', ')||'Sin definir'}</p><p><b>Objetivos:</b> ${f.objective||'Pendiente'}</p><p><b>Contexto:</b> ${f.context||'Pendiente'}</p><p><b>Contenidos:</b> ${(f.items||[]).length}</p></article>`).join(''):'<p>No hay formatos creados.</p>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{app.otherFormats.splice(+b.dataset.del,1);persist();renderFormats()})}const areas=['Lengua y Literatura','Matemática','Lenguas Adicionales','Educación Física','Artes','Tecnologías','FEC','Ciencias Sociales','Ciencias Naturales','Tutoría','Otros formatos curriculares'];function renderHours(){$('hoursTable').innerHTML=areas.map(area=>`<tr><th>${area}</th>${Array.from({length:10},(_,i)=>`<td><input type="number" min="0" step="1" value="${Number(app.hourAssignments?.[area]?.[i+1]||0)}" data-area="${area}" data-term="${i+1}" style="width:70px"></td>`).join('')}</tr>`).join('');document.querySelectorAll('[data-area][data-term]').forEach(inp=>inp.oninput=()=>{const a=inp.dataset.area,t=inp.dataset.term;if(!app.hourAssignments[a])app.hourAssignments[a]={};app.hourAssignments[a][t]=Number(inp.value||0)})}$('add').onclick=()=>{const name=$('name').value.trim();if(!name){alert('Ingresá un nombre.');return}const type=$('type').value;app.otherFormats.push({name,formatType:type,type,weeklyHours:Number($('hours').value||0),hours:Number($('hours').value||0),term:String($('term').value),character:$('character').value,areas:$('areas').value.split(',').map(x=>x.trim()).filter(Boolean),objective:$('objective').value.trim(),context:$('context').value.trim(),items:$('items').value.split(',').map(x=>x.trim()).filter(Boolean)});persist();['name','areas','objective','context','items'].forEach(id=>$(id).value='');renderFormats()};$('save').onclick=persist;renderFormats();renderHours();</script></body></html>
