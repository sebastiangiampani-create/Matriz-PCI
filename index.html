<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz PCI</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f8;color:#15374a}body{display:flex;flex-direction:column;overflow:hidden}.site-header{height:104px;flex:0 0 104px;display:flex;align-items:center;justify-content:center;padding:8px 16px;background:#fff;border-bottom:1px solid #dbe5e8;z-index:20}.site-logo{display:block;width:min(320px,74vw);height:86px;object-fit:contain}.app-shell{position:relative;flex:1;min-height:0}.app-frame{display:block;width:100%;height:100%;border:0}.all-actions{position:absolute;right:14px;bottom:14px;z-index:40;display:none}.all-actions.visible{display:block}.all-actions button{border:1px solid #dbe5e8;border-radius:14px;padding:12px 15px;font-weight:900;background:#fff;color:#15374a;box-shadow:0 8px 24px rgba(21,55,74,.18);cursor:pointer}.site-footer{height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;padding:5px 12px;background:#fff;border-top:1px solid #dbe5e8;color:#687985;font-size:.78rem;font-weight:700;z-index:20}@media(max-width:700px){.site-header{height:86px;flex-basis:86px;padding:6px 8px}.site-logo{width:min(260px,84vw);height:72px}.all-actions{left:8px;right:8px;bottom:8px}.all-actions button{width:100%;padding:12px 7px;font-size:.8rem}.site-footer{height:30px;flex-basis:30px;font-size:.72rem}}</style></head><body><header class="site-header"><img class="site-logo" src="assets/logo-escuela-de-maestros.svg?v=6" alt="Escuela de Maestros"></header><main class="app-shell"><iframe id="app" class="app-frame" src="app.html" title="Matriz PCI"></iframe><div id="allActions" class="all-actions"><button id="printAllBtn">Imprimir todas las áreas</button></div></main><footer class="site-footer">Diseñado por Sebastián Giampani</footer><script>const frame=document.getElementById('app'),allActions=document.getElementById('allActions');function getApp(){return frame.contentWindow}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function activeScreen(){return frame.contentDocument?.querySelector('.screen.active')?.id||''}function pluralLabel(label){return label==='Nivel'?'Niveles':label==='Taller'?'Talleres':label==='Laboratorio'?'Laboratorios':label+'s'}function fixAreaCards(){const w=getApp(),d=frame.contentDocument;if(!w||!d||!w.CFG)return;d.querySelectorAll('.area[data-a]').forEach(card=>{const cfg=w.CFG[card.dataset.a],line=card.querySelector('.muted');if(cfg&&line)line.textContent=`${cfg.n} ${pluralLabel(cfg.l)}`})}function injectFixes(){const w=getApp(),d=frame.contentDocument;if(!d||!w)return;let style=d.getElementById('outer-responsive-fixes');if(!style){style=d.createElement('style');style.id='outer-responsive-fixes';style.textContent='.footer{display:none!important}.area-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.area-tools .btn{flex:0 0 auto}@media(max-width:800px){body{padding-bottom:96px!important}.top{position:sticky!important;top:0!important;z-index:35!important;flex-wrap:wrap!important;gap:6px!important}.actions{width:100%!important;justify-content:flex-start!important}.actions .btn{flex:0 0 auto!important}.screen{max-width:100%!important;overflow-x:hidden!important}.card,.group,.progress{max-width:100%!important}.workspace,.group-grid{min-width:0!important}.report-table{min-width:720px}.mobile-bag-button{bottom:72px!important}.selection-bar{bottom:64px!important}.area-tools{display:grid;grid-template-columns:1fr 1fr}.area-tools .btn{width:100%;padding:11px 7px;font-size:.82rem}}';d.head.appendChild(style)}const board=d.getElementById('board');if(board&&!d.getElementById('areaTools')){const tools=d.createElement('div');tools.id='areaTools';tools.className='area-tools no-print';tools.innerHTML='<button id="exportAdvance" class="btn mint">Exportar avance</button><button id="printAdvance" class="btn primary">Imprimir avance</button>';d.getElementById('title').insertAdjacentElement('afterend',tools);d.getElementById('exportAdvance').onclick=()=>{if(w.app?.current)w.downloadReport()};d.getElementById('printAdvance').onclick=()=>{if(!w.app?.current)return;w.renderSummary();w.show('summary');setTimeout(()=>w.print(),150)}}}function syncUI(){injectFixes();fixAreaCards();allActions.classList.toggle('visible',activeScreen()==='areas')}function printAllAreas(){const w=getApp();if(!w||!w.app||!w.DATA||!w.CFG)return;const sections=[];for(const area of Object.keys(w.CFG)){const data=w.app.areas[area];if(!data){sections.push(`<section><h2>${esc(area)}</h2><p>Área todavía no iniciada.</p></section>`);continue}const groups=data.groups.map(g=>{const items=(g.items||[]).map(id=>w.DATA.find(x=>x.id===id)).filter(Boolean).map(x=>`<li>${esc(x.subject)} — ${esc(x.axis||'Sin eje/bloque')} — ${esc(x.text)}</li>`).join('');return `<article><h3>${esc(g.name)}</h3>${g.objective?`<p><b>Objetivos:</b> ${esc(g.objective)}</p>`:''}${g.context?`<p><b>Contexto:</b> ${esc(g.context)}</p>`:''}${g.type?`<p><b>Tipo:</b> ${esc(g.type)}</p>`:''}<ul>${items||'<li>Sin contenidos asignados</li>'}</ul></article>`}).join('');sections.push(`<section><h2>${esc(area)}</h2><p><b>Estado:</b> ${data.closed?'Cerrada':'En proceso'}</p>${groups}</section>`)}const win=window.open('','_blank');if(!win)return;win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Matriz PCI completa</title><style>body{font-family:Arial,sans-serif;color:#15374a;margin:24px}h1{border-bottom:3px solid #83ded3;padding-bottom:8px}section{break-before:page;margin-bottom:28px}section:first-of-type{break-before:auto}article{break-inside:avoid;border:1px solid #dbe5e8;border-radius:12px;padding:12px;margin:10px 0}li{margin:5px 0}@media print{body{margin:10mm}}</style></head><body><h1>Matriz PCI · Todas las áreas</h1>${sections.join('')}<p style="margin-top:30px;color:#687985;text-align:center">Diseñado por Sebastián Giampani</p></body></html>`);win.document.close();win.focus();setTimeout(()=>win.print(),300)}frame.addEventListener('load',()=>{setTimeout(syncUI,250);setInterval(syncUI,500)});document.getElementById('printAllBtn').onclick=printAllAreas;</script></body></html>
