<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz PCI</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f8}iframe{display:block;width:100%;height:100%;border:0}.logo-wrap{position:fixed;left:14px;top:10px;z-index:10000;background:#fff;border:1px solid #dbe5e8;border-radius:14px;padding:6px 10px;box-shadow:0 6px 18px rgba(21,55,74,.12)}.logo-wrap img{display:block;width:150px;height:auto}.quick-actions{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.quick-actions button{border:0;border-radius:14px;padding:12px 15px;font-weight:900;box-shadow:0 8px 24px rgba(21,55,74,.24);cursor:pointer}.preview{background:#15374a;color:#fff}.export{background:#83ded3;color:#15374a}.notice{position:fixed;left:14px;bottom:16px;z-index:9999;background:#fff;border:1px solid #dbe5e8;border-radius:12px;padding:9px 12px;color:#687985;font-size:.8rem;max-width:290px}@media(max-width:700px){.logo-wrap{left:8px;top:7px;padding:4px 7px;border-radius:10px}.logo-wrap img{width:95px}.quick-actions{left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:1fr 1fr}.quick-actions button{padding:13px 8px;font-size:.84rem}.notice{display:none}}</style></head><body><div class="logo-wrap"><img src="assets/logo-escuela-de-maestros.svg" alt="Escuela de Maestros"></div><iframe id="app" src="app.html" title="Matriz PCI"></iframe><div class="notice">Podés imprimir o exportar en cualquier momento, aunque el área todavía esté incompleta.</div><div class="quick-actions"><button id="exportBtn" class="export">Exportar avance</button><button id="printBtn" class="preview">Imprimir avance</button></div><script>
const frame=document.getElementById('app');
function getApp(){return frame.contentWindow}
function prepare(){const w=getApp();if(!w||!w.app||!w.app.current){alert('Primero abrí un área para generar el informe.');return null}try{w.renderSummary();w.show('summary');return w}catch(e){console.error(e);alert('No se pudo preparar el informe. Actualizá la página e intentá nuevamente.');return null}}
function pluralLabel(label){return label==='Nivel'?'Niveles':label==='Taller'?'Talleres':label==='Laboratorio'?'Laboratorios':label+'s'}
function improveApp(){const w=getApp(),d=frame.contentDocument;if(!w||!d||!w.CFG)return;const actions=d.querySelector('.actions');if(actions&&!d.getElementById('back')){const back=d.createElement('button');back.id='back';back.className='btn';back.textContent='← Volver';actions.prepend(back);back.onclick=()=>{const active=d.querySelector('.screen.active')?.id;if(active==='summary'){w.show('board')}else if(active==='board'){w.show('areas')}else if(active==='areas'){w.show('start')}}}
const fixAreaLabels=()=>{d.querySelectorAll('.area[data-a]').forEach(card=>{const cfg=w.CFG[card.dataset.a],line=card.querySelector('.muted');if(cfg&&line)line.textContent=`${cfg.n} ${pluralLabel(cfg.l)}`})};
if(!w.__labelsFixed){const original=w.renderAreas;w.renderAreas=function(){original.apply(this,arguments);fixAreaLabels()};w.__labelsFixed=true}fixAreaLabels()}
frame.addEventListener('load',()=>{setTimeout(improveApp,250);setTimeout(improveApp,1000)});
document.getElementById('printBtn').onclick=()=>{const w=prepare();if(w)setTimeout(()=>w.print(),150)};
document.getElementById('exportBtn').onclick=()=>{const w=prepare();if(w)setTimeout(()=>w.downloadReport(),100)};
</script></body></html>
