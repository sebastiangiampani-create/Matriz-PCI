<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz PCI</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f8;color:#15374a}body{display:flex;flex-direction:column;overflow:hidden}.site-header{height:74px;flex:0 0 74px;display:flex;align-items:center;padding:7px 14px;background:#fff;border-bottom:1px solid #dbe5e8;z-index:20}.site-header img{display:block;width:165px;height:auto;max-height:60px;object-fit:contain}.app-shell{position:relative;flex:1;min-height:0}.app-frame{display:block;width:100%;height:100%;border:0}.quick-actions{position:absolute;right:14px;bottom:14px;z-index:40;display:none;gap:8px;flex-wrap:wrap;justify-content:flex-end}.quick-actions.visible{display:flex}.quick-actions button{border:0;border-radius:14px;padding:12px 15px;font-weight:900;box-shadow:0 8px 24px rgba(21,55,74,.24);cursor:pointer}.preview{background:#15374a;color:#fff}.export{background:#83ded3;color:#15374a}.all-areas{background:#fff;color:#15374a;border:1px solid #dbe5e8!important}.credit{position:absolute;left:14px;bottom:18px;z-index:30;font-size:.75rem;color:#687985;background:#ffffffdd;border-radius:10px;padding:6px 9px;display:none}.credit.visible{display:block}@media(max-width:700px){.site-header{height:60px;flex-basis:60px;justify-content:center;padding:4px 8px}.site-header img{width:128px;max-height:50px}.quick-actions{left:8px;right:8px;bottom:8px;display:none;grid-template-columns:1fr 1fr;gap:7px}.quick-actions.visible{display:grid}.quick-actions.all-mode{grid-template-columns:1fr}.quick-actions button{padding:12px 7px;font-size:.78rem}.credit{display:none!important}}
</style></head><body><header class="site-header"><img src="assets/logo-escuela-de-maestros.svg" alt="Escuela de Maestros" onerror="this.style.display='none'"></header><main class="app-shell"><iframe id="app" class="app-frame" src="app.html" title="Matriz PCI"></iframe><div id="credit" class="credit">Diseñado por Sebastián Giampani</div><div id="areaActions" class="quick-actions"><button id="exportBtn" class="export">Exportar avance</button><button id="printBtn" class="preview">Imprimir avance</button></div><div id="allActions" class="quick-actions all-mode"><button id="printAllBtn" class="all-areas">Imprimir todas las áreas</button></div></main><script>
const frame=document.getElementById('app'),areaActions=document.getElementById('areaActions'),allActions=document.getElementById('allActions'),credit=document.getElementById('credit');
function getApp(){return frame.contentWindow}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function activeScreen(){return frame.contentDocument?.querySelector('.screen.active')?.id||''}
function injectFixes(){const d=frame.contentDocument;if(!d||d.getElementById('outer-responsive-fixes'))return;const style=d.createElement('style');style.id='outer-responsive-fixes';style.textContent=`.footer{display:none!important}@media(max-width:800px){body{padding-bottom:96px!important}.top{position:sticky!important;top:0!important;z-index:35!important;flex-wrap:wrap!important;gap:6px!important}.actions{width:100%!important;justify-content:flex-start!important}.actions .btn{flex:0 0 auto!important}.screen{max-width:100%!important;overflow-x:hidden!important}.card,.group,.progress{max-width:100%!important}.workspace,.group-grid{min-width:0!important}.report-table{min-width:720px}.mobile-bag-button{bottom:72px!important}.selection-bar{bottom:64px!important}}`;d.head.appendChild(style)}
function syncUI(){injectFixes();const screen=activeScreen();areaActions.classList.toggle('visible',screen==='board'||screen==='summary');allActions.classList.toggle('visible',screen==='areas');credit.classList.toggle('visible',screen==='board'||screen==='summary');}
function prepareArea(){const w=getApp();if(!w||!w.app||!w.app.current){alert('Primero abrí un área para generar el informe.');return null}try{w.renderSummary();w.show('summary');return w}catch(e){console.error(e);alert('No se pudo preparar el informe.');return null}}
function printAllAreas(){const w=getApp();if(!w||!w.app||!w.DATA||!w.CFG){alert('La matriz todavía se está cargando.');return}const areaNames=Object.keys(w.CFG),sections=[];for(const area of areaNames){const cfg=w.CFG[area],data=w.app.areas[area];if(!data){sections.push(`<section><h2>${esc(area)}</h2><p>Área todavía no iniciada.</p></section>`);continue}const groups=data.groups.map(g=>{const items=(g.items||[]).map(id=>w.DATA.find(x=>x.id===id)).filter(Boolean).map(x=>`<li>${esc(x.subject)} — ${esc(x.axis||'Sin eje/bloque')} — ${esc(x.text)}</li>`).join('');return `<article><h3>${esc(g.name)}</h3>${g.objective?`<p><b>Objetivos:</b> ${esc(g.objective)}</p>`:''}${g.context?`<p><b>Contexto:</b> ${esc(g.context)}</p>`:''}${g.type?`<p><b>Tipo:</b> ${esc(g.type)}</p>`:''}<ul>${items||'<li>Sin contenidos asignados</li>'}</ul></article>`}).join('');sections.push(`<section><h2>${esc(area)}</h2><p><b>Estado:</b> ${data.closed?'Cerrada':'En proceso'}</p>${groups}</section>`)}const win=window.open('','_blank');if(!win){alert('El navegador bloqueó la ventana de impresión.');return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Matriz PCI completa</title><style>body{font-family:Arial,sans-serif;color:#15374a;margin:24px}h1{border-bottom:3px solid #83ded3;padding-bottom:8px}section{break-before:page;margin-bottom:28px}section:first-of-type{break-before:auto}article{break-inside:avoid;border:1px solid #dbe5e8;border-radius:12px;padding:12px;margin:10px 0}li{margin:5px 0}@media print{body{margin:10mm}}</style></head><body><h1>Matriz PCI · Todas las áreas</h1>${sections.join('')}</body></html>`);win.document.close();win.focus();setTimeout(()=>win.print(),300)}
frame.addEventListener('load',()=>{setTimeout(syncUI,250);setInterval(syncUI,500)});
document.getElementById('printBtn').onclick=()=>{const w=prepareArea();if(w)setTimeout(()=>w.print(),150)};
document.getElementById('exportBtn').onclick=()=>{const w=prepareArea();if(w)setTimeout(()=>w.downloadReport(),100)};
document.getElementById('printAllBtn').onclick=printAllAreas;
</script></body></html>
